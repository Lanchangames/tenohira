<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手のひらのナイショ話</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1515; /* 中世の夜を思わせる暗い背景 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none; 
            font-family: 'Hiragino Mincho ProN', 'Noto Serif JP', serif; /* 世界観に合わせて明朝体へ */
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            background-color: #f4d5b6; /* 手のひらの肌色 */
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .screen.active {
            display: flex;
        }

        /* タイトル画面 */
        #title-screen {
            background: linear-gradient(rgba(26,21,21,0.8), rgba(26,21,21,0.8)), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%233e2723"/></svg>');
            background-size: cover;
        }
        h1 {
            color: #f4d5b6;
            text-shadow: 2px 2px 5px #000;
            margin-bottom: 60px;
            font-size: 26px;
            letter-spacing: 2px;
        }

        /* UI要件: ボタンはすべて同じサイズ・デザイン */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 70%;
        }
        .menu-btn {
            width: 100%;
            height: 55px;
            background-color: #8d4a4a;
            border: 2px solid #d3b89e;
            border-radius: 5px;
            color: #fff;
            font-size: 18px;
            font-family: 'Hiragino Mincho ProN', 'Noto Serif JP', serif;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: transform 0.1s;
            box-sizing: border-box;
        }
        .menu-btn:active {
            transform: scale(0.95);
        }

        /* ゲーム画面UI */
        #canvas-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        /* 相手の照れ/くすぐったいゲージ */
        #gauge-container {
            position: absolute;
            top: 20px;
            left: 10%;
            width: 80%;
            height: 10px;
            background-color: rgba(0,0,0,0.2);
            border-radius: 5px;
            z-index: 2;
            display: none;
            overflow: hidden;
        }
        #gauge-bar {
            width: 0%;
            height: 100%;
            background-color: #ff6b6b;
            transition: width 0.1s;
        }
        #gauge-text {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            color: #8d4a4a;
            font-size: 14px;
            font-weight: bold;
            z-index: 2;
            display: none;
        }

        /* メッセージウィンドウ */
        #message-box {
            position: absolute;
            bottom: 5%;
            left: 5%;
            right: 5%;
            height: 25%;
            background-color: rgba(26, 21, 21, 0.85);
            border: 2px solid #d3b89e;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #f4d5b6;
            cursor: pointer; /* タップで文字送り */
        }
        #message-text {
            margin: 0;
            font-size: 16px;
            line-height: 1.8;
            letter-spacing: 1px;
        }
        .blink-triangle {
            align-self: flex-end;
            animation: blink 1s infinite;
            font-size: 14px;
        }
        @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }

        #finish-btn {
            position: absolute;
            bottom: 35%;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 30px;
            background-color: #8d4a4a;
            border: 2px solid #d3b89e;
            color: white;
            border-radius: 5px;
            z-index: 4;
            display: none;
            font-family: inherit;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- タイトル画面 -->
        <div id="title-screen" class="screen active">
            <h1>手のひらのナイショ話</h1>
            <div class="button-group">
                <button class="menu-btn" onclick="startGame()">はじめから</button>
                <button class="menu-btn" onclick="alert('セーブデータはありません')">つづきから</button>
                <button class="menu-btn" onclick="alert('設定項目はありません')">オプション</button>
            </div>
        </div>

        <!-- ゲーム画面 -->
        <div id="game-screen" class="screen">
            <canvas id="canvas-layer"></canvas>
            
            <div id="gauge-container">
                <div id="gauge-bar"></div>
            </div>
            <div id="gauge-text">相手の限界ゲージ</div>

            <button id="finish-btn" onclick="finishFinalDraw()">書き終える</button>

            <div id="message-box" onclick="advanceText()">
                <p id="message-text"></p>
                <div class="blink-triangle" id="next-mark">▼</div>
            </div>
        </div>
    </div>

    <script>
        // --- シナリオデータ ---
        const scenarios = {
            day1_intro: [
                "夕食の片付けも終わり、暖炉の火がパチパチと心地よい音を立てている。",
                "「……ほら、手。貸して」",
                "日課となっているマッサージ。幼馴染の彼は、少し照れくさそうにゴツゴツした手のひらを差し出した。",
                "親指でゆっくりとほぐしていると、ふと、伝えられない想いが胸に込み上げてきた。",
                "（……このまま、手のひらに文字を書いたら、伝わるかな）",
                "【指で画面をなぞって、文字を書いてみよう】"
            ],
            day1_fail: [
                "「……っ、ちょ、待て！」",
                "ビクッと肩を揺らし、彼は慌てて手を引っ込めた。",
                "「くすぐったいって！ 何書いてるか全然わからなかったぞ……」",
                "どうやら、ゆっくり書いている間に消えてしまったらしい。明日の夜、もう一度試してみよう……。"
            ],
            day2_intro: [
                "翌日の夜。",
                "今日も食後、暖炉の前で彼の手をマッサージする時間がやってきた。",
                "「……昨日みたいに、くすぐったくすんなよ？」",
                "警戒しつつも手を預けてくれる彼。",
                "（今日こそ、少しでも伝わるように……早く、でも丁寧に書こう）"
            ],
            day2_fail: [
                "「あーっ！ もう限界、ギブ！！」",
                "またしても手を引っ込められてしまった。",
                "「お前、絶対わざとやってるだろ！ 手のひらは敏感なんだってば……」",
                "赤くなった顔で睨まれる。もどかしい。伝わらないまま、また夜が更けていく……。"
            ],
            day3_intro: [
                "さらに数日後の夜。",
                "「……」",
                "今日は無言のまま、彼からすっと手のひらを差し出してきた。",
                "「……今日は、逃げないから。くすぐったくても我慢する」",
                "「お前が何書きたいのか、ちゃんと知りたいから……教えてくれよ」",
                "彼の真剣な眼差し。",
                "（……今なら、きっと全部伝わる）",
                "【ゆっくりと、あなたの想いを書いてください】"
            ],
            day3_outro: [
                "書き終え、そっと指を離す。",
                "彼はじっと自分の手のひらを見つめ……やがて、耳まで真っ赤に染め上げた。",
                "「……っ、ばか」",
                "「……そういう大事なことは、文字じゃなくて、ちゃんと声に出して言えよ」",
                "そう言いながらも、彼は握りしめたその手を、愛おしそうに自分の胸に押し当てた。",
                "〜 プレイありがとうございました 〜"
            ]
        };

        // --- ゲーム状態管理 ---
        let currentDay = 1;
        let phase = 'title'; // 'title', 'text', 'draw'
        let textQueue = [];
        let isDrawing = false;
        let gauge = 0;
        let isFinalDay = false;
        
        // --- キャンバス設定 ---
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        const gaugeContainer = document.getElementById('gauge-container');
        const gaugeBar = document.getElementById('gauge-bar');
        const gaugeText = document.getElementById('gauge-text');
        const msgBox = document.getElementById('message-box');
        const msgText = document.getElementById('message-text');
        const nextMark = document.getElementById('next-mark');
        const finishBtn = document.getElementById('finish-btn');

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            // 背景を肌色で塗りつぶす
            ctx.fillStyle = '#f4d5b6';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // --- ゲーム進行制御 ---
        function startGame() {
            document.getElementById('title-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            resizeCanvas();
            startDay(1);
            requestAnimationFrame(gameLoop);
        }

        function startDay(day) {
            currentDay = day;
            gauge = 0;
            isFinalDay = (day === 3);
            
            ctx.fillStyle = '#f4d5b6';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (day === 1) playText(scenarios.day1_intro, () => startDrawPhase());
            if (day === 2) playText(scenarios.day2_intro, () => startDrawPhase());
            if (day === 3) playText(scenarios.day3_intro, () => startDrawPhase());
        }

        // --- テキストシステム ---
        let textCallback = null;
        function playText(texts, callback) {
            phase = 'text';
            textQueue = [...texts];
            textCallback = callback;
            msgBox.style.display = 'flex';
            gaugeContainer.style.display = 'none';
            gaugeText.style.display = 'none';
            showNextText();
        }

        function showNextText() {
            if (textQueue.length > 0) {
                msgText.innerText = textQueue.shift();
            } else {
                if (textCallback) textCallback();
            }
        }

        function advanceText() {
            if (phase === 'text') {
                showNextText();
            }
        }

        // --- お絵かき（マッサージ）システム ---
        function startDrawPhase() {
            phase = 'draw';
            msgBox.style.display = 'none'; // 文字を書く時はメッセージ枠を消す
            
            if (!isFinalDay) {
                gaugeContainer.style.display = 'block';
                gaugeText.style.display = 'block';
                gaugeBar.style.width = '0%';
            } else {
                // 最終日は「書き終える」ボタンを表示
                finishBtn.style.display = 'block';
            }
        }

        // 座標取得
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function handleStart(e) {
            if (phase !== 'draw') return;
            e.preventDefault();
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            // 最終日ははっきりとした色、それまでは少しぼやけた色
            ctx.strokeStyle = isFinalDay ? 'rgba(180, 70, 70, 0.8)' : 'rgba(200, 100, 100, 0.5)';
        }

        function handleMove(e) {
            if (!isDrawing || phase !== 'draw') return;
            e.preventDefault();
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();

            // 1,2日目は触っている間にゲージ上昇
            if (!isFinalDay) {
                // 2日目はゲージ上昇が早い（難易度アップ）
                gauge += (currentDay === 1) ? 0.8 : 1.2; 
                gaugeBar.style.width = gauge + '%';

                if (gauge >= 100) {
                    failDay();
                }
            }
        }

        function handleEnd(e) {
            if (isDrawing) {
                e.preventDefault();
                isDrawing = false;
            }
        }

        // PCとスマホのイベント登録（passive:falseでスクロール防止を確実にする）
        canvas.addEventListener('mousedown', handleStart, {passive: false});
        canvas.addEventListener('mousemove', handleMove, {passive: false});
        canvas.addEventListener('mouseup', handleEnd, {passive: false});
        canvas.addEventListener('mouseleave', handleEnd, {passive: false});

        canvas.addEventListener('touchstart', handleStart, {passive: false});
        canvas.addEventListener('touchmove', handleMove, {passive: false});
        canvas.addEventListener('touchend', handleEnd, {passive: false});

        // --- メインループ（線のフェードアウト処理） ---
        function gameLoop() {
            if (phase === 'draw' && !isFinalDay) {
                // 肌色を極薄く重ね塗りし続けることで、書いた線が体温で消えていく「もどかしさ」を表現
                ctx.fillStyle = 'rgba(244, 213, 182, 0.03)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 触っていない時は少しずつゲージ（火照り）が冷める
                if (!isDrawing && gauge > 0) {
                    gauge -= 0.2;
                    gaugeBar.style.width = gauge + '%';
                }
            }
            requestAnimationFrame(gameLoop);
        }

        // --- 日数遷移 ---
        function failDay() {
            isDrawing = false;
            phase = 'text';
            gaugeContainer.style.display = 'none';
            gaugeText.style.display = 'none';
            
            if (currentDay === 1) {
                playText(scenarios.day1_fail, () => startDay(2));
            } else if (currentDay === 2) {
                playText(scenarios.day2_fail, () => startDay(3));
            }
        }

        function finishFinalDraw() {
            isDrawing = false;
            finishBtn.style.display = 'none';
            playText(scenarios.day3_outro, () => {
                nextMark.style.display = 'none'; // 最後は▼を消す
            });
        }
    </script>
</body>
</html>

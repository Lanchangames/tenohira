<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ゆびさきで秘密を</title>

<style>

html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #3e2723;
    touch-action: none;
    font-family:
    'Zen Maru Gothic',
    'Hiragino Maru Gothic ProN',
    'M PLUS Rounded 1c',
    sans-serif;
    user-select: none;
    -webkit-user-select: none;
}

#game-container{
    width:100%;
    height:100dvh;
    background:#FFF3E0;
    position:relative;
    overflow:hidden;
}

.screen{
    display:none;
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#FFE0B2;
}

.screen.active{
    display:flex;
}

#game-screen{
    background:none;
}

#title-logo{
    width:85%;
    max-width:320px;
    margin-bottom:30px;
}

#badge-box{
    background:rgba(255,255,255,0.85);
    border:2px dashed #FFAB91;
    border-radius:20px;
    padding:15px;
    width:80%;
    margin-bottom:30px;
    box-sizing:border-box;
}

.badge-box-title{
    color:#D84315;
    text-align:center;
    font-size:16px;
    margin-bottom:10px;
    font-weight:bold;
}

#key-display{
    text-align:center;
    color:#D84315;
    font-size:14px;
    margin-bottom:15px;
    font-weight:bold;
}

#badge-container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
}

.badge{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#FFF;
    border:2px solid #FFE0B2;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#FFCCBC;
    font-size:16px;
    font-weight:bold;
}

.badge.unlocked{
    background:#FF8A65;
    border-color:#FF8A65;
    color:#FFF;
}

.badge.unlocked-x{
    background:#FFD54F;
    border-color:#FFD54F;
    color:#D84315;
}

.button-group{
    display:flex;
    flex-direction:column;
    gap:20px;
    width:75%;
    align-items:center;
}

.menu-btn{
    width:220px;
    height:55px;
    border:none;
    border-radius:30px;
    background:#FF8A65;
    color:white;
    font-size:18px;
    font-weight:bold;
    font-family:inherit;
}

#canvas-layer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
}

#blush-overlay{
    position:absolute;
    inset:0;
    background:#ff5252;
    opacity:0;
    pointer-events:none;
    z-index:1;
    transition:opacity 0.3s;
}

#draw-instruction{
    position:absolute;
    top:15px;
    width:100%;
    text-align:center;
    color:#5D4037;
    font-size:20px;
    font-weight:bold;
    z-index:2;
    display:none;
}

#gauge-label{
    position:absolute;
    top:75px;
    width:100%;
    text-align:center;
    color:#5D4037;
    font-size:14px;
    font-weight:bold;
    z-index:2;
    display:none;
}

#gauge-container{
    position:absolute;
    top:100px;
    left:10%;
    width:80%;
    height:14px;
    background:#FFE0B2;
    border:3px solid #FFF;
    border-radius:10px;
    z-index:2;
    display:none;
    overflow:hidden;
}

#gauge-bar{
    width:0%;
    height:100%;
    background:#FF7043;
}

#stroke-counter{
    position:absolute;
    top:125px;
    width:100%;
    text-align:center;
    color:#5D4037;
    font-weight:bold;
    font-size:18px;
    z-index:2;
    display:none;
}

#time-counter{
    position:absolute;
    top:150px;
    width:100%;
    text-align:center;
    color:#5D4037;
    font-weight:bold;
    font-size:18px;
    z-index:2;
    display:none;
}

#warning-text{
    position:absolute;
    top:40%;
    width:100%;
    text-align:center;
    color:#D84315;
    font-size:24px;
    font-weight:bold;
    opacity:0;
    transition:opacity .5s;
    z-index:10;
}

#message-box{
    position:absolute;
    bottom:3%;
    left:5%;
    right:5%;
    height:25%;
    background:rgba(255,255,255,.95);
    border:3px solid #FFAB91;
    border-radius:20px;
    padding:18px;
    box-sizing:border-box;
    z-index:3;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    color:#5D4037;
}

#message-text{
    margin:0;
    font-size:16px;
    line-height:1.8;
    font-weight:bold;
}

.blink-triangle{
    align-self:flex-end;
    animation:blink 1s infinite;
    font-size:16px;
    color:#FF8A65;
}

@keyframes blink{
    0%{opacity:0;}
    50%{opacity:1;}
    100%{opacity:0;}
}

#choice-overlay{
    position:absolute;
    inset:0;
    background:rgba(255,249,245,.9);
    z-index:4;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.choice-hint{
    color:#5D4037;
    margin-bottom:25px;
    font-size:15px;
    font-weight:bold;
}

#finish-btn{
    position:absolute;
    bottom:35%;
    left:50%;
    transform:translateX(-50%);
    width:220px;
    height:55px;
    border:none;
    border-radius:30px;
    background:#FF8A65;
    color:white;
    font-size:18px;
    font-weight:bold;
    display:none;
    z-index:4;
}

#day-transition{
    position:absolute;
    inset:0;
    background:#FF8A65;
    color:white;
    z-index:10;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    font-weight:bold;
    opacity:0;
    pointer-events:none;
    transition:opacity 1s;
}

</style>
</head>

<body>

<div id="game-container">

<div id="title-screen" class="screen active">

<img src="title.png" id="title-logo">

<div id="badge-box">

<div class="badge-box-title">
獲得エンディングバッジ
</div>

<div id="key-display">
てのひらの鍵: 0 個
</div>

<div id="badge-container"></div>

</div>

<div class="button-group">

<button class="menu-btn"
onclick="startGame()">
はじめから
</button>

</div>

</div>

<div id="game-screen" class="screen">

<div id="blush-overlay"></div>

<canvas id="canvas-layer"></canvas>

<div id="day-transition"></div>

<div id="draw-instruction">
てのひらに文字を書こう
</div>

<div id="gauge-label">
🐾 彼のくすぐったいゲージ 🐾
</div>

<div id="gauge-container">
<div id="gauge-bar"></div>
</div>

<div id="stroke-counter"></div>

<div id="time-counter"></div>

<div id="warning-text"></div>

<div id="choice-overlay">

<div class="choice-hint">
※画数が多いほど制限時間が長く、好感度も上がります
</div>

<div class="button-group"
id="choices-container"></div>

</div>

<button id="finish-btn"
onclick="completeDrawPhase()">
書き終える
</button>

<div id="message-box"
onclick="advanceText()">

<p id="message-text"></p>

<div class="blink-triangle">
▼
</div>

</div>

</div>

</div>

<script>

const canvas =
document.getElementById('canvas-layer');

const ctx =
canvas.getContext('2d');

const msgText =
document.getElementById('message-text');

const choiceOverlay =
document.getElementById('choice-overlay');

const choicesContainer =
document.getElementById('choices-container');

const finishBtn =
document.getElementById('finish-btn');

const drawInstruction =
document.getElementById('draw-instruction');

const gaugeLabel =
document.getElementById('gauge-label');

const gaugeContainer =
document.getElementById('gauge-container');

const gaugeBar =
document.getElementById('gauge-bar');

const strokeCounter =
document.getElementById('stroke-counter');

const timeCounter =
document.getElementById('time-counter');

const warningText =
document.getElementById('warning-text');

const blushOverlay =
document.getElementById('blush-overlay');

let phase='title';

let currentTextSequence=[];

let textCallback=null;

let currentDayIdx=0;

let currentChoice=null;

let currentStrokes=0;

let playerAffection=0;

let choiceHistory=[];

let timeRemaining=0;

let tickleGauge=0;

let warningShown=false;

let lastTime=0;

let isDrawing=false;

let lastX=0;

let lastY=0;

const sensitiveAreas=[
    {x:0.25,y:0.35,r:0.18},
    {x:0.75,y:0.55,r:0.22}
];

function resizeCanvas(){

    canvas.width =
    canvas.parentElement.clientWidth;

    canvas.height =
    canvas.parentElement.clientHeight;
}

window.addEventListener(
'resize',
resizeCanvas
);

function playText(texts,onComplete){

    currentTextSequence=[...texts];

    textCallback=onComplete;

    advanceText();
}

function advanceText(){

    if(currentTextSequence.length===0){

        if(textCallback){

            const cb=textCallback;

            textCallback=null;

            cb();
        }

        return;
    }

    msgText.innerHTML=
    currentTextSequence.shift();
}

function startGame(){

    document
    .querySelectorAll('.screen')
    .forEach(s=>s.classList.remove('active'));

    document
    .getElementById('game-screen')
    .classList.add('active');

    resizeCanvas();

    currentDayIdx=0;

    playerAffection=0;

    choiceHistory=[];

    startDay();

    requestAnimationFrame(gameLoop);
}

const dailyData=[

{
label:"１日目",

intro:[

"夕食後の静かな時間。",
"窓の外では柔らかな風が吹いている。",
"暖炉の火が静かに揺れ、部屋には穏やかな空気が満ちていた。",
"彼はソファにもたれながら、ちらりとこちらを見る。",
"「……また、やるのか？」",
"少し呆れたような声。",
"でも、その声音には昨日より柔らかな響きが混じっている。",
"「別に嫌ってわけじゃないけどさ」",
"そう言いながら、彼はゆっくりと右手を差し出した。",
"大きな手。",
"温かそうな手。",
"見ているだけで胸がどきどきしてしまう。",
"（今日はどんな言葉を書こう……？）"

],

choices:[

{ text:"「あ」", req:3, reward:1, diff:0 },

{ text:"「ねえ」", req:6, reward:2, diff:1 },

{ text:"「おつかれ」", req:9, reward:3, diff:2 }

],

success:[

"指先が滑るたび、彼の肩が小さく揺れる。",
"「……ん」",
"かすかな吐息。",
"「なんか、悪くないな」",
"暖炉の火がぱちりと音を立てた。",
"近い距離。",
"重なる視線。",
"心臓の音がうるさい。",
"彼は目を細めながら、もう一度こちらへ手を差し出した。",
"「また明日もやるか？」"

],

fail:[

"「っ、あは、待っ……！」",
"彼は慌てたように手を引っ込めた。",
"「だ、だめだ、くすぐったい……！」",
"耳まで真っ赤になっている。",
"少し悔しい。",
"でも、そんな反応を見ると、また触れたくなってしまう。",
"（次はもっと上手くやりたいな……）"

]

},

{
label:"２日目",

intro:[

"二日目の夜。",
"彼は何も言わず、自然にこちらへ手を差し出してきた。",
"昨日よりもずっと自然な動作。",
"「……今日は何書くんだよ」",
"どこか期待しているような声。",
"暖炉の火がゆっくりと揺れる。",
"静かな時間。",
"近い距離。",
"指先が触れそうになるだけで胸が高鳴る。",
"（今日は少し長い言葉を書いてみようかな……）"

],

choices:[

{ text:"「い」", req:2, reward:1, diff:0 },

{ text:"「いつも」", req:6, reward:2, diff:1 },

{ text:"「きもちいい」", req:14, reward:3, diff:2 }

],

success:[

"「……お前、手あったかいな」",
"ぽつりと落ちた言葉。",
"彼は自分の手を見つめ、小さく笑った。",
"「なんか落ち着く」",
"「変な感じだな」",
"その横顔が優しくて、胸が熱くなる。",
"もっと触れていたい。",
"もっと近づきたい。",
"そんな気持ちが、少しずつ大きくなっていく。"

],

fail:[

"「あーっ、もう！」",
"彼はソファに倒れ込みながら笑った。",
"「くすぐったいって言ってるだろ……！」",
"怒っているわけじゃない。",
"むしろ楽しそうで。",
"そんな表情を見ていると、こちらまで笑ってしまった。",
"夜はまだ終わらない。",
"明日もきっと、この続きをする。"

]

}

];

function startDay(){

    if(currentDayIdx>=dailyData.length){

        playText([

            "書き終え、そっと指を離す。",
            "彼は自分の手のひらをじっと見つめていた。",
            "暖炉の火が小さく爆ぜる。",
            "静かな沈黙。",
            "やがて彼はゆっくりとこちらを見る。",
            "「……伝わってるよ」",
            "その声は優しかった。",
            "彼はそっと手を重ねる。",
            "「お前、本当に不器用だな」",
            "苦笑混じりの声。",
            "でも、その瞳はどこまでも穏やかだった。",
            "「けどさ」",
            "「そんなふうに、一生懸命伝えようとしてくれるの……嬉しい」",
            "胸が熱くなる。",
            "彼の体温が指先から伝わってくる。",
            "「また明日も、隣にいろよ」",
            "その言葉だけで十分だった。",
            "暖炉の火がゆっくり揺れる。",
            "夜は静かに更けていく。",
            "END"

        ]);

        return;
    }

    const day=dailyData[currentDayIdx];

    const transition=
    document.getElementById('day-transition');

    transition.innerText=day.label;

    transition.style.opacity='1';

    setTimeout(()=>{

        transition.style.opacity='0';

        setTimeout(()=>{

            playText(
                day.intro,
                ()=>showChoices(day.choices)
            );

        },1000);

    },1800);
}

function showChoices(choices){

    phase='choice';

    choiceOverlay.style.display='flex';

    choicesContainer.innerHTML='';

    choices.forEach(c=>{

        const btn=document.createElement('button');

        btn.className='menu-btn';

        btn.innerText=c.text;

        btn.onclick=()=>startDrawPhase(c);

        choicesContainer.appendChild(btn);
    });
}

function startDrawPhase(choice){

    choiceOverlay.style.display='none';

    phase='draw';

    currentChoice=choice;

    tickleGauge=0;

    currentStrokes=0;

    warningShown=false;

    timeRemaining = choice.req * 2000;

    lastTime = performance.now();

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawInstruction.style.display='block';

    gaugeLabel.style.display='block';

    gaugeContainer.style.display='block';

    strokeCounter.style.display='block';

    timeCounter.style.display='block';

    finishBtn.style.display='none';

    strokeCounter.innerText=
    `残り: ${choice.req} 画`;

    gaugeBar.style.width='0%';

    blushOverlay.style.opacity='0';
}

function startDrawing(e){

    if(phase!=='draw') return;

    isDrawing=true;

    const rect=
    canvas.getBoundingClientRect();

    const clientX=
    e.touches ?
    e.touches[0].clientX :
    e.clientX;

    const clientY=
    e.touches ?
    e.touches[0].clientY :
    e.clientY;

    lastX=clientX-rect.left;

    lastY=clientY-rect.top;
}

function draw(e){

    if(!isDrawing || phase!=='draw')
    return;

    e.preventDefault();

    const rect=
    canvas.getBoundingClientRect();

    const clientX=
    e.touches ?
    e.touches[0].clientX :
    e.clientX;

    const clientY=
    e.touches ?
    e.touches[0].clientY :
    e.clientY;

    const x=
    clientX-rect.left;

    const y=
    clientY-rect.top;

    const moveDist=
    Math.hypot(
        x-lastX,
        y-lastY
    );

    ctx.beginPath();

    ctx.moveTo(lastX,lastY);

    ctx.lineTo(x,y);

    ctx.strokeStyle='#D84315';

    ctx.lineWidth=6;

    ctx.lineCap='round';

    ctx.stroke();

    sensitiveAreas.forEach(area=>{

        const cx=
        area.x*canvas.width;

        const cy=
        area.y*canvas.height;

        const cr=
        area.r*canvas.width;

        const dist=
        Math.hypot(
            x-cx,
            y-cy
        );

        if(dist<cr){

            tickleGauge +=
            Math.min(
                10,
                moveDist*0.2
            );
        }
    });

    lastX=x;

    lastY=y;
}

function stopDrawing(e){

    if(e) e.preventDefault();

    if(!isDrawing || phase!=='draw')
    return;

    isDrawing=false;

    currentStrokes++;

    const remain=
    Math.max(
        0,
        currentChoice.req-currentStrokes
    );

    strokeCounter.innerText=
    `残り: ${remain} 画`;

    if(currentStrokes>=currentChoice.req){

        finishBtn.style.display='block';
    }
}

canvas.addEventListener(
'mousedown',
startDrawing
);

canvas.addEventListener(
'mousemove',
draw
);

canvas.addEventListener(
'mouseup',
stopDrawing
);

canvas.addEventListener(
'touchstart',
startDrawing,
{passive:false}
);

canvas.addEventListener(
'touchmove',
draw,
{passive:false}
);

canvas.addEventListener(
'touchend',
stopDrawing
);

canvas.addEventListener(
'touchcancel',
stopDrawing
);

function completeDrawPhase(){

    if(currentStrokes>=currentChoice.req){

        endDrawPhase(true);
    }
}

function endDrawPhase(success){

    phase='text';

    drawInstruction.style.display='none';

    gaugeLabel.style.display='none';

    gaugeContainer.style.display='none';

    strokeCounter.style.display='none';

    timeCounter.style.display='none';

    finishBtn.style.display='none';

    blushOverlay.style.opacity='0';

    choiceHistory.push({

        diff:currentChoice.diff,

        success:success
    });

    if(success){

        playerAffection +=
        currentChoice.reward;
    }

    const day=
    dailyData[currentDayIdx];

    const texts=
    success ?
    day.success :
    day.fail;

    playText(texts,()=>{

        currentDayIdx++;

        startDay();
    });
}

function showDynamicWarning(text,duration){

    warningShown=true;

    warningText.innerText=text;

    warningText.style.opacity='1';

    setTimeout(()=>{

        warningText.style.opacity='0';

        warningShown=false;

    },duration);
}

function gameLoop(timestamp){

    if(phase==='draw'){

        if(!lastTime){

            lastTime=timestamp;
        }

        const dt=
        timestamp-lastTime;

        lastTime=timestamp;

        timeRemaining -= dt;

        timeCounter.innerText=
        `残り時間: ${
            Math.max(
                0,
                timeRemaining/1000
            ).toFixed(1)
        }秒`;

        tickleGauge=
        Math.max(
            0,
            tickleGauge-dt*0.008
        );

        gaugeBar.style.width=
        Math.min(
            100,
            tickleGauge
        )+'%';

        blushOverlay.style.opacity=
        Math.max(
            0,
            (tickleGauge-20)/80
        )*0.55;

        if(!warningShown){

            if(timeRemaining<=4000){

                showDynamicWarning(
                    "「……時間、まだ？」",
                    2000
                );
            }

            else if(tickleGauge>=90){

                showDynamicWarning(
                    "「待って、そこ…っ」",
                    1500
                );
            }

            else if(tickleGauge>=60){

                showDynamicWarning(
                    "「ちょっと…！」",
                    1500
                );
            }

            else if(
                tickleGauge>=30 &&
                Math.random()<0.02
            ){

                showDynamicWarning(
                    "「ふふ、くすぐったい」",
                    1500
                );
            }
        }

        if(
            timeRemaining<=0 ||
            tickleGauge>=100
        ){

            endDrawPhase(false);
        }
    }

    requestAnimationFrame(gameLoop);
}

resizeCanvas();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手のひらのナイショ話</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1515;
            touch-action: none;
            font-family: 'Hiragino Mincho ProN', 'Noto Serif JP', serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            width: 100%;
            height: 100dvh;
            max-height: 100%;
            max-width: 400px;
            margin: 0 auto;
            background-color: #f4d5b6;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(26,21,21,0.8), rgba(26,21,21,0.8)), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%233e2723"/></svg>');
            background-size: cover;
        }
        .screen.active {
            display: flex;
        }

        #game-screen {
            background: none;
        }

        h1 {
            color: #f4d5b6;
            text-shadow: 2px 2px 5px #000;
            margin-bottom: 20px;
            font-size: 26px;
            letter-spacing: 2px;
        }

        /* エンディングバッジボックス */
        #badge-box {
            background-color: rgba(26, 21, 21, 0.85);
            border: 2px solid #d3b89e;
            border-radius: 8px;
            padding: 15px;
            width: 80%;
            margin-bottom: 30px;
            box-sizing: border-box;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .badge-box-title {
            color: #f4d5b6;
            text-align: center;
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }
        #badge-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .badge {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #443;
            border: 2px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #111;
            font-size: 14px;
            font-weight: bold;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
            transition: all 0.3s;
        }
        .badge.unlocked {
            background-color: #f4d5b6;
            border-color: #8d4a4a;
            color: #8d4a4a;
            box-shadow: 0 0 8px #f4d5b6;
        }
        .badge.unlocked-x {
            background-color: #ff6b6b;
            border-color: #fff;
            color: #fff;
            box-shadow: 0 0 10px #ff6b6b;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 70%;
            z-index: 5;
        }
        .menu-btn {
            width: 100%;
            height: 55px;
            background-color: #8d4a4a;
            border: 2px solid #d3b89e;
            border-radius: 5px;
            color: #fff;
            font-size: 18px;
            font-family: 'Hiragino Mincho ProN', 'Noto Serif JP', serif;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: transform 0.1s;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .menu-btn:active {
            transform: scale(0.95);
        }

        .instruction-text {
            color: #f4d5b6;
            width: 85%;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px #000;
        }
        .instruction-text p { margin: 10px 0; }

        #canvas-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        #gauge-label {
            position: absolute;
            top: 2px;
            width: 100%;
            text-align: center;
            color: #8d4a4a;
            font-size: 12px;
            font-weight: bold;
            z-index: 2;
            display: none;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.7);
        }

        #gauge-container {
            position: absolute;
            top: 20px;
            left: 10%;
            width: 80%;
            height: 10px;
            background-color: rgba(0,0,0,0.2);
            border-radius: 5px;
            z-index: 2;
            display: none;
            overflow: hidden;
        }
        #gauge-bar {
            width: 0%;
            height: 100%;
            background-color: #ff6b6b;
            transition: width 0.1s;
        }

        #stroke-counter {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            color: #8d4a4a;
            font-weight: bold;
            font-size: 16px;
            z-index: 2;
            display: none;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
        }

        /* 制限時間タイマー */
        #time-counter {
            position: absolute;
            top: 65px;
            width: 100%;
            text-align: center;
            color: #8d4a4a;
            font-weight: bold;
            font-size: 16px;
            z-index: 2;
            display: none;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
        }

        /* 警告テキスト */
        #warning-text {
            position: absolute;
            top: 35%;
            width: 100%;
            text-align: center;
            color: #d35400;
            font-size: 24px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s;
            text-shadow: 0px 0px 8px rgba(255,255,255,0.9);
            pointer-events: none;
            z-index: 10;
        }

        #choice-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            z-index: 4;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .choice-hint {
            color: #f4d5b6;
            margin-bottom: 20px;
            font-size: 14px;
            text-shadow: 1px 1px 3px #000;
        }

        #message-box {
            position: absolute;
            bottom: 3%;
            left: 5%;
            right: 5%;
            height: 25%;
            background-color: rgba(26, 21, 21, 0.85);
            border: 2px solid #d3b89e;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #f4d5b6;
            cursor: pointer;
        }
        #message-text {
            margin: 0;
            font-size: 16px;
            line-height: 1.8;
            letter-spacing: 1px;
        }
        .blink-triangle {
            align-self: flex-end;
            animation: blink 1s infinite;
            font-size: 14px;
        }
        @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }

        #finish-btn {
            position: absolute;
            bottom: 35%;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 30px;
            background-color: #8d4a4a;
            border: 2px solid #d3b89e;
            color: white;
            border-radius: 5px;
            z-index: 4;
            display: none;
            font-family: inherit;
            font-size: 16px;
        }

        #day-transition {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1515;
            color: #f4d5b6;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            letter-spacing: 6px;
            opacity: 0;
            pointer-events: none; 
            transition: opacity 1s ease-in-out;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- タイトル画面 -->
        <div id="title-screen" class="screen active">
            <h1>手のひらのナイショ話</h1>
            <div id="badge-box">
                <div class="badge-box-title">獲得エンディングバッジ</div>
                <div id="badge-container">
                    <!-- JSでバッジを生成 -->
                </div>
            </div>
            <div class="button-group">
                <button class="menu-btn" onclick="startGame()">はじめから</button>
                <button class="menu-btn" onclick="showHowTo()">遊び方</button>
            </div>
        </div>

        <!-- 遊び方画面 -->
        <div id="how-to-screen" class="screen">
            <h1>遊び方</h1>
            <div class="instruction-text">
                <p>① 毎日、書きたい言葉（難易度）を選びます。</p>
                <p>② 指で画面をなぞって、<strong>手を離した時</strong>に1画とカウントされます。</p>
                <p>③ 制限時間内に「目標画数」をすべて書き終えると成功！</p>
                <p>④ 難易度（画数）が高いほど好感度が上がります。</p>
                <p>★ エンディングは全部で９種類。特定の選択肢を選び続けると特別な結末が…？</p>
            </div>
            <div class="button-group">
                <button class="menu-btn" onclick="showTitle()">タイトルへ戻る</button>
            </div>
        </div>

        <!-- ゲーム画面 -->
        <div id="game-screen" class="screen">
            <canvas id="canvas-layer"></canvas>
            
            <div id="day-transition">１日目</div>

            <div id="gauge-label">🐾 彼のくすぐったいゲージ 🐾</div>
            <div id="gauge-container"><div id="gauge-bar"></div></div>
            <div id="stroke-counter">残り: 0 画</div>
            <div id="time-counter">残り時間: 0.0秒</div>
            <div id="warning-text">「ふふ、くすぐったい」</div>

            <div id="choice-overlay">
                <div class="choice-hint">※画数が多いほど制限時間が長く、好感度も上がります</div>
                <div class="button-group" id="choices-container"></div>
            </div>

            <button id="finish-btn" onclick="completeDrawPhase()">書き終える</button>

            <div id="message-box" onclick="advanceText()">
                <p id="message-text"></p>
                <div class="blink-triangle" id="next-mark">▼</div>
            </div>
        </div>
    </div>

    <script>
        // --- データ管理・セーブ機能 ---
        let unlockedEndings = [];
        try {
            unlockedEndings = JSON.parse(localStorage.getItem('secretHandshakeEndings')) || [];
        } catch (e) {
            unlockedEndings = [];
        }

        function saveEnding(id) {
            if (!unlockedEndings.includes(id)) {
                unlockedEndings.push(id);
                try {
                    localStorage.setItem('secretHandshakeEndings', JSON.stringify(unlockedEndings));
                } catch (e) {}
            }
        }

        function renderBadges() {
            const container = document.getElementById('badge-container');
            container.innerHTML = '';
            for (let i = 1; i <= 9; i++) {
                const badge = document.createElement('div');
                badge.className = 'badge';
                if (unlockedEndings.includes(i)) {
                    badge.innerText = i === 9 ? 'X' : i;
                    badge.classList.add(i === 9 ? 'unlocked-x' : 'unlocked');
                } else {
                    badge.innerText = '?';
                }
                container.appendChild(badge);
            }
        }

        function showTitle() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('title-screen').classList.add('active');
            renderBadges();
        }

        function showHowTo() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('how-to-screen').classList.add('active');
        }

        renderBadges();

        function resizeCanvas() {

            ctx.fillRect(0, 0, canvas.width, canvas.height);

            timeCounter.innerText = `残り時間: ${(timeRemaining / 1000).toFixed(1)}秒`;
            timeCounter.style.display = 'block';

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function handleStart(e) {
            if (phase !== 'draw') return;
            e.preventDefault();
            isDrawing = true;
            hasMovedInStroke = false;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = (currentDayIdx === 4) ? 'rgba(180, 70, 70, 0.9)' : 'rgba(200, 100, 100, 0.5)';
        }

        function handleMove(e) {
            if (!isDrawing || phase !== 'draw') return;
            e.preventDefault();
            hasMovedInStroke = true;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function handleEnd(e) {
            if (isDrawing && phase === 'draw') {
                e.preventDefault();
                isDrawing = false;
                
                // 指を離した時に画数を1追加（タップだけでも少し動けばOK）
                if (hasMovedInStroke) {
                    drawPoints++;
                    let remaining = Math.max(0, currentTargetReq - drawPoints);
                    strokeCounter.innerText = `残り: ${remaining} 画`;

                    if (remaining === 0) {
                        finishBtn.style.display = 'block';
                    }
                }
            }
        }

        canvas.addEventListener('mouseup', handleEnd, {passive: false});
        canvas.addEventListener('mouseleave', handleEnd, {passive: false});
        canvas.addEventListener('touchstart', handleStart, {passive: false});
        canvas.addEventListener('touchmove', handleMove, {passive: false});
        canvas.addEventListener('touchend', handleEnd, {passive: false});

        function gameLoop(timestamp) {
            if (phase === 'draw') {
                if (!lastTime) lastTime = timestamp;
                let dt = timestamp - lastTime;
                lastTime = timestamp;
                timeRemaining -= dt;

                let secs = Math.max(0, timeRemaining / 1000).toFixed(1);
                timeCounter.innerText = `残り時間: ${secs}秒`;

                // 時間の減少に連動してゲージ（相手の我慢ゲージ）が増加
                let gaugePercent = ((totalTimeLimit - timeRemaining) / totalTimeLimit) * 100;
                gaugeBar.style.width = gaugePercent + '%';

                if (timeRemaining <= 4000 && !warningShown) {
                    warningShown = true;
                    warningText.style.opacity = '1';
                    setTimeout(() => { warningText.style.opacity = '0'; }, 2000); // 2秒で消える
                }

                if (timeRemaining <= 0) {
                    failDrawPhase();
                }

                // 描いた線が薄れていく演出
                ctx.fillStyle = 'rgba(244, 213, 182, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {

            }

                resultText.push("すべてを知った上で、私はもう一度彼の隣に座り、この手をとった。");
                resultText.push("「……お前には、全部見透かされてる気がする」");
                resultText.push("彼は静かに微笑み、私の手を両手で包み込んで、祈るように額を押し当てた。");
                resultText.push("「どんな結末になっても、俺の隣にはいつもお前がいてくれた」");
                resultText.push("「これからも、ずっと隣にいるよ」");
                resultText.push("「ああ、わかってる。……もう、言葉なんてなくても伝わってるから」");
                resultText.push("言葉を超えた絆が、確かに二人の間に結ばれている。");
                resultText.push("彼の手のひらに綴ったナイショ話は、もう秘密ではなくなった。");
                resultText.push("これからは隠すことなく、堂々と、私の想いを彼に伝え続けていこう。");
                resultText.push("（ダミーテキスト：ED9の終わり）");
            }

            resultText.push("（ダミーテキスト：エンディングここまで）");
            resultText.push("〜 CLEAR！ プレイありがとうございました 〜");

            const lockedEndings = [1, 2, 3, 4, 5, 6, 7, 8, 9].filter(x => !unlockedEndings.includes(x));
            if (lockedEndings.length === 0) {
                resultText.push("★全エンディングコンプリート！おめでとうございます！");
            } else {
                let hintId;
                if (lockedEndings.length === 1 && lockedEndings[0] === 9) {
                    hintId = 9; 
                } else {
                    const availableHints = lockedEndings.filter(x => x !== 9);
                    hintId = availableHints[Math.floor(Math.random() * availableHints.length)];
                }
                resultText.push(endingHints[hintId]);
            }

            resultText.push("〜 タイトルに戻ります 〜");

            playText(resultText, () => {
                nextMark.style.display = 'none'; 
                msgBox.onclick = () => {
                    showTitle();
                };
            });
        }
    </script>

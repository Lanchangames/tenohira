<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手のひらのナイショ話</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1515;
            touch-action: none;
            font-family: 'Hiragino Mincho ProN', 'Noto Serif JP', serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            width: 100%;
            height: 100dvh;
            max-height: 100%;
            max-width: 400px;
            margin: 0 auto;
            background-color: #f4d5b6;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .screen.active {
            display: flex;
        }

        #title-screen {
            background: linear-gradient(rgba(26,21,21,0.8), rgba(26,21,21,0.8)), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%233e2723"/></svg>');
            background-size: cover;
        }
        
        h1 {
            color: #f4d5b6;
            text-shadow: 2px 2px 5px #000;
            margin-bottom: 60px;
            font-size: 26px;
            letter-spacing: 2px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 70%;
            z-index: 5;
        }
        .menu-btn {
            width: 100%;
            height: 55px;
            background-color: #8d4a4a;
            border: 2px solid #d3b89e;
            border-radius: 5px;
            color: #fff;
            font-size: 18px;
            font-family: 'Hiragino Mincho ProN', 'Noto Serif JP', serif;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: transform 0.1s;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .menu-btn:active {
            transform: scale(0.95);
        }

        #canvas-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        #gauge-container {
            position: absolute;
            top: 20px;
            left: 10%;
            width: 80%;
            height: 10px;
            background-color: rgba(0,0,0,0.2);
            border-radius: 5px;
            z-index: 2;
            display: none;
            overflow: hidden;
        }
        #gauge-bar {
            width: 0%;
            height: 100%;
            background-color: #ff6b6b;
            transition: width 0.1s;
        }

        #choice-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            z-index: 4;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .choice-hint {
            color: #f4d5b6;
            margin-bottom: 20px;
            font-size: 14px;
            text-shadow: 1px 1px 3px #000;
        }

        #message-box {
            position: absolute;
            bottom: 3%;
            left: 5%;
            right: 5%;
            height: 25%;
            background-color: rgba(26, 21, 21, 0.85);
            border: 2px solid #d3b89e;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #f4d5b6;
            cursor: pointer;
        }
        #message-text {
            margin: 0;
            font-size: 16px;
            line-height: 1.8;
            letter-spacing: 1px;
        }
        .blink-triangle {
            align-self: flex-end;
            animation: blink 1s infinite;
            font-size: 14px;
        }
        @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }

        #finish-btn {
            position: absolute;
            bottom: 35%;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 30px;
            background-color: #8d4a4a;
            border: 2px solid #d3b89e;
            color: white;
            border-radius: 5px;
            z-index: 4;
            display: none;
            font-family: inherit;
            font-size: 16px;
        }

        /* 日付変更の演出用オーバーレイ */
        #day-transition {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1515;
            color: #f4d5b6;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            letter-spacing: 6px;
            opacity: 0;
            pointer-events: none; /* クリックを阻害しないように */
            transition: opacity 1s ease-in-out;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="title-screen" class="screen active">
            <h1>手のひらのナイショ話</h1>
            <div class="button-group">
                <button class="menu-btn" onclick="startGame()">はじめから</button>
                <button class="menu-btn" onclick="alert('セーブデータはありません')">つづきから</button>
                <button class="menu-btn" onclick="alert('設定項目はありません')">オプション</button>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <canvas id="canvas-layer"></canvas>
            
            <!-- 日付変更アイキャッチ -->
            <div id="day-transition">１日目</div>

            <div id="gauge-container">
                <div id="gauge-bar"></div>
            </div>

            <div id="choice-overlay">
                <div class="choice-hint">※画数が多いほど難しく、好感度が上がります</div>
                <div class="button-group" id="choices-container"></div>
            </div>

            <button id="finish-btn" onclick="completeDrawPhase()">書き終える</button>

            <div id="message-box" onclick="advanceText()">
                <p id="message-text"></p>
                <div class="blink-triangle" id="next-mark">▼</div>
            </div>
        </div>
    </div>

    <script>
        // --- 5日間のシナリオと選択肢データ ---
        // ノベルゲーム風に各配列の文章量を5倍程度に拡張（プレースホルダー）
        const dailyData = [
            {
                day: 1,
                label: "１日目",
                intro: [
                    "夕食後の穏やかな時間。パチパチと暖炉の火が爆ぜる音が部屋に響いている。",
                    "（ダミーテキスト：ここからご自身の文章に書き換えてください）",
                    "今日は少し冷え込む夜だった。こんな日は、いつも以上に火の温もりがありがたい。",
                    "彼と私は、幼い頃からずっとこんな風に一緒に過ごしてきた。",
                    "昔はただの遊び相手だったのに、いつの間にか私にとって特別な存在になっている。",
                    "だけど、その気持ちを言葉にするのは、どうしても怖くて……。",
                    "「……ほら、手。貸して」",
                    "日課となっているマッサージ。彼はいつも通り、無防備に手のひらを差し出した。",
                    "ゴツゴツとした、少し大きくなったその手を両手で包み込む。",
                    "親指でゆっくりとほぐしていると、ふと、胸の奥で燻っていた想いが込み上げてきた。",
                    "声に出せないなら、せめて……。",
                    "（……この手に、文字を書いてみたら、少しは伝わるかな？）",
                    "（手始めに、なんて書いてみよう？）"
                ],
                choices: [
                    { text: "「あ」", req: 40, reward: 1 },
                    { text: "「ねえ」", req: 80, reward: 2 },
                    { text: "「おつかれ」", req: 140, reward: 3 }
                ],
                success: [
                    "「……ん。なんか、悪くないな」",
                    "（ダミーテキスト：ここからご自身の文章に書き換えてください）",
                    "彼は不思議そうな顔をしながらも、嫌がる素振りは見せなかった。",
                    "指先から伝わる彼の体温が、私の手にもじんわりと移ってくるようだ。",
                    "もう少しだけ長く触れていたかったけれど、今日はここまでにしよう。",
                    "（少しだけ、私の気持ちが伝わったような気がする）"
                ],
                fail: [
                    "「っ、ちょ！ くすぐったい！」",
                    "（ダミーテキスト：ここからご自身の文章に書き換えてください）",
                    "ビクッと肩を揺らし、彼は慌てて手を引っ込めてしまった。",
                    "「急に変な触り方すんなよ。びっくりするだろ……」",
                    "少しムスッとした顔で、彼は自分の手のひらを擦っている。",
                    "どうやら、ゆっくり書きすぎてただくすぐったかっただけのようだ。",
                    "（焦りすぎたかな……。また明日、試してみよう）"
                ]
            },
            {
                day: 2,
                label: "２日目",
                intro: [
                    "（ダミーテキスト：ここからご自身の文章に書き換えてください）",
                    "翌日の夜。",
                    "昨日のことがあったからか、彼は少しだけ警戒しているように見えた。",
                    "それでも、夕食が終わると自然な流れで隣に座り、手を差し出してくれる。",
                    "「……あんま、くすぐったくすんなよ」",
                    "「わかってるってば」",
                    "そう言い返しながら、私は再び彼の手を握った。",
                    "昨日よりも少しだけ、脈が早い気がするのは気のせいだろうか。",
                    "（今日はもう少しだけ、踏み込んだことを書いてみようかな）"
                ],
                choices: [
                    { text: "「て」", req: 40, reward: 1 },
                    { text: "「いつも」", req: 90, reward: 2 },
                    { text: "「きもちいい？」", req: 150, reward: 3 }
                ],
                success: [
                    "「……お前、手あったかいな」",
                    "（ダミーテキスト：ここからご自身の文章に書き換えてください）",
                    "ぽつりと呟いた彼の顔が、暖炉の火のせいだけではなく赤く見える。",
                    "なんだかお互いに無言になってしまって、少しだけ気まずい。",
                    "でも、この気まずさは決して嫌なものではなかった。",
                    "（文字の意味、どこまでわかってくれたんだろう……）"
                ],
                fail: [
                    "「あーっ！ もう限界！」",
                    "（ダミーテキスト：ここからご自身の文章に書き換えてください）",
                    "またしても手を引っ込められてしまった。",
                    "「お前、絶対わざとやってるだろ……手のひらは敏感なんだってば」",
                    "「ご、ごめんって」",
                    "やっぱりまだ長文を書くのは難しかったみたいだ。",
                    "（次こそは、ちゃんと書き切りたいな……）"
                ]
            },
            {
                day: 3,
                label: "３日目",
                intro: [
                    "（ダミーテキスト：ここからご自身の文章に書き換えてください）",
                    "３日目の夜。",
                    "今日は彼の方から何も言わず、無言で手が差し出された。",
                    "その仕草が少しだけ不器用で、なんだか可愛らしく思えてしまう。",
                    "「……ん」",
                    "彼の手を握ると、昨日よりも少しだけ手に力が入っているのがわかった。",
                    "どうやら、彼なりにマッサージの時間を心待ちにしてくれているらしい。",
                    "（今日は、少し長めに書いてみようかな……？）"
                ],
                choices: [
                    { text: "「ん」", req: 40, reward: 1 },
                    { text: "「がんばれ」", req: 100, reward: 2 },
                    { text: "「ありがとう」", req: 160, reward: 3 }
                ],
                success: [
                    "「……もっと、続けてもいいぞ」",
                    "（ダミーテキスト：ここからご自身の文章に書き換えてください）",
                    "そっぽを向きながら、彼が小さな声で言った。",
                    "その言葉に、胸の奥がぎゅっと締め付けられる。",
                    "少しずつ、彼もこの時間を特別なものだと感じてくれているのかもしれない。",
                    "（明日も、こうして一緒にいられますように……）"
                ],
                fail: [
                    "「……っ、ん、やっぱ無理！！」",
                    "（ダミーテキスト：ここからご自身の文章に書き換えてください）",
                    "変に力を入れてしまって、またしても失敗してしまった。",
                    "「なんだよ今日のマッサージ。全然リラックスできねぇ」",
                    "文句を言いながらも、彼はどこか楽しそうに笑っている。",
                    "（もどかしいけど……このやり取りも、悪くないかも）"
                ]
            },
            {
                day: 4,
                label: "４日目",
                intro: [
                    "（ダミーテキスト：ここからご自身の文章に書き換えてください）",
                    "４日目。",
                    "「……最近、お前のマッサージがないと落ち着かないかも」",
                    "ぽつりと零した彼の言葉に、私は思わず手をとめてしまった。",
                    "「……そ、そう？」",
                    "「ああ。なんか、一日が終わったって気がするんだよな」",
                    "無自覚にそんなことを言える彼が、少しだけ恨めしい。",
                    "私の方は、この時間が来るたびにドキドキして心臓が破裂しそうなのに。",
                    "（今日こそ、もっと踏み込んだ言葉を……）"
                ],
                choices: [
                    { text: "「ほら」", req: 50, reward: 1 },
                    { text: "「あしたも」", req: 110, reward: 2 },
                    { text: "「ずっといっしょ」", req: 180, reward: 3 }
                ],
                success: [
                    "「……ん。なんか、すごく落ち着く」",
                    "（ダミーテキスト：ここからご自身の文章に書き換えてください）",
                    "手のひらを通じて、確かな温もりが伝わってくる。",
                    "彼の鼓動が、私の指先を伝って直接響いてくるような錯覚に陥った。",
                    "あと少し。あと少しだけ言葉を紡げば、この関係は変わるかもしれない。",
                    "（いよいよ明日は、一番伝えたいことを書こう……）"
                ],
                fail: [
                    "「あーもう、ごめん！ 限界！！」",
                    "（ダミーテキスト：ここからご自身の文章に書き換えてください）",
                    "あともう少しだったのに、彼は頭を抱えてしゃがみこんでしまった。",
                    "「……お前が何したいのか、わかんねぇよ……」",
                    "彼の耳は真っ赤に染まっている。",
                    "（ごめんね。でも、明日こそは……絶対に伝えるから）"
                ]
            },
            {
                day: 5,
                label: "最終日",
                intro: [
                    "（ダミーテキスト：ここからご自身の文章に書き換えてください）",
                    "そして、５日目の夜。",
                    "いつもと同じ暖炉の火。いつもと同じ椅子。",
                    "だけど、今日だけは空気が少し違っていた。",
                    "彼が私の目を真っ直ぐに見つめ、ぎゅっと一度手を握り、そして開いた。",
                    "「……今日は、逃げない。だから……」",
                    "「お前が何書きたいのか、ちゃんと知りたい。教えてくれ」",
                    "彼の真剣な眼差しに、私はごくりと息を飲んだ。",
                    "もう誤魔化しはきかない。彼も、私が何かを伝えようとしていることに気づいている。",
                    "（今なら、きっと伝わる）",
                    "（彼の手のひらに、私の本当の想いを……なんて書こう？）"
                ],
                choices: [
                    { text: "「すき」", req: 60, reward: 2 },
                    { text: "「だいすき」", req: 120, reward: 4 },
                    { text: "「あいしてる」", req: 200, reward: 6 }
                ]
            }
        ];

        let currentDayIdx = 0;
        let phase = 'title'; 
        let textQueue = [];
        let isDrawing = false;
        let gauge = 0;
        let drawPoints = 0;
        
        let playerAffection = 0;
        let currentTargetReq = 0;
        let currentReward = 0;
        let isGameLoopRunning = false;

        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        const gaugeContainer = document.getElementById('gauge-container');
        const gaugeBar = document.getElementById('gauge-bar');
        const msgBox = document.getElementById('message-box');
        const msgText = document.getElementById('message-text');
        const nextMark = document.getElementById('next-mark');
        const finishBtn = document.getElementById('finish-btn');
        const choiceOverlay = document.getElementById('choice-overlay');
        const choicesContainer = document.getElementById('choices-container');
        const dayTransition = document.getElementById('day-transition');

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.fillStyle = '#f4d5b6';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function startGame() {
            document.getElementById('title-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            playerAffection = 0;
            currentDayIdx = 0;
            resizeCanvas();
            
            if (!isGameLoopRunning) {
                isGameLoopRunning = true;
                requestAnimationFrame(gameLoop);
            }
            startDay();
        }

        function startDay() {
            gauge = 0;
            drawPoints = 0;
            currentTargetReq = 0;
            currentReward = 0;
            ctx.fillStyle = '#f4d5b6';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const dayData = dailyData[currentDayIdx];

            // 日付変更の演出処理
            dayTransition.innerText = dayData.label;
            dayTransition.style.opacity = '1';
            
            // 演出中のクリック防止
            phase = 'transition';

            setTimeout(() => {
                dayTransition.style.opacity = '0';
                setTimeout(() => {
                    playText(dayData.intro, showDailyChoices);
                }, 1000); // フェードアウトが終わるのを待つ
            }, 1800); // アイキャッチを表示しておく時間
        }

        function playText(texts, callback) {
            phase = 'text';
            textQueue = [...texts];
            window.textCallback = callback;
            msgBox.style.display = 'flex';
            gaugeContainer.style.display = 'none';
            finishBtn.style.display = 'none';
            nextMark.style.display = 'block';
            showNextText();
        }

        function showNextText() {
            if (textQueue.length > 0) {
                msgText.innerText = textQueue.shift();
            } else {
                if (window.textCallback) window.textCallback();
            }
        }

        function advanceText() {
            if (phase === 'text') showNextText();
        }

        function showDailyChoices() {
            phase = 'choice';
            msgBox.style.display = 'none';
            choiceOverlay.style.display = 'flex';
            choicesContainer.innerHTML = '';
            
            const dayData = dailyData[currentDayIdx];
            dayData.choices.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'menu-btn';
                btn.innerText = opt.text;
                btn.onclick = () => {
                    currentTargetReq = opt.req;
                    currentReward = opt.reward;
                    choiceOverlay.style.display = 'none';
                    startDrawPhase();
                };
                choicesContainer.appendChild(btn);
            });
        }

        function startDrawPhase() {
            phase = 'draw';
            gaugeContainer.style.display = 'block';
            gaugeBar.style.width = '0%';
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function handleStart(e) {
            if (phase !== 'draw') return;
            e.preventDefault();
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = (currentDayIdx === 4) ? 'rgba(180, 70, 70, 0.9)' : 'rgba(200, 100, 100, 0.5)';
        }

        function handleMove(e) {
            if (!isDrawing || phase !== 'draw') return;
            e.preventDefault();
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();

            drawPoints++;
            
            if (drawPoints >= currentTargetReq) {
                finishBtn.style.display = 'block';
            }
        }

        function handleEnd(e) {
            if (isDrawing) {
                e.preventDefault();
                isDrawing = false;
            }
        }

        canvas.addEventListener('mousedown', handleStart, {passive: false});
        canvas.addEventListener('mousemove', handleMove, {passive: false});
        canvas.addEventListener('mouseup', handleEnd, {passive: false});
        canvas.addEventListener('mouseleave', handleEnd, {passive: false});
        canvas.addEventListener('touchstart', handleStart, {passive: false});
        canvas.addEventListener('touchmove', handleMove, {passive: false});
        canvas.addEventListener('touchend', handleEnd, {passive: false});

        function gameLoop() {
            if (phase === 'draw') {
                ctx.fillStyle = 'rgba(244, 213, 182, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (isDrawing) {
                    const gaugeSpeed = (currentDayIdx === 4) ? 0.15 : 0.25;
                    gauge += gaugeSpeed;
                    gaugeBar.style.width = gauge + '%';

                    if (gauge >= 100) {
                        failDrawPhase();
                    }
                } else if (gauge > 0) {
                    gauge -= 0.2;
                    gaugeBar.style.width = gauge + '%';
                }
            }
            if (isGameLoopRunning) {
                requestAnimationFrame(gameLoop);
            }
        }

        function failDrawPhase() {
            isDrawing = false;
            gaugeContainer.style.display = 'none';
            finishBtn.style.display = 'none';
            
            if (currentDayIdx === 4) {
                playerAffection += 1; 
                evaluateEnding();
            } else {
                const dayData = dailyData[currentDayIdx];
                playText(dayData.fail, () => {
                    currentDayIdx++;
                    startDay();
                });
            }
        }

        function completeDrawPhase() {
            isDrawing = false;
            gaugeContainer.style.display = 'none';
            finishBtn.style.display = 'none';
            
            playerAffection += currentReward; 

            if (currentDayIdx === 4) {
                evaluateEnding();
            } else {
                const dayData = dailyData[currentDayIdx];
                playText(dayData.success, () => {
                    currentDayIdx++;
                    startDay();
                });
            }
        }

        // --- 5つのハッピーエンド分岐 ---
        // ノベルゲーム風にエンディングテキストも大幅に拡張（プレースホルダー）
        function evaluateEnding() {
            let resultText = [];
            
            resultText.push("（ダミーテキスト：ここからエンディングの文章です）");
            resultText.push("書き終え、そっと指を離す。");
            resultText.push("彼は自分の手のひらを見つめ……やがて、私の手をぎゅっと握り返した。");
            resultText.push("沈黙が落ちる。薪がパチッと音を立てた。");

            // 好感度（最大18）による分岐
            if (playerAffection <= 3) {
                // Ending 1
                resultText.push("「……お前、本当に不器用だよな」");
                resultText.push("「正直、なんて書いてたのか全然わからなかったぞ。文字っていうか、ただ撫で回されてるみたいだったし」");
                resultText.push("「……でもさ」");
                resultText.push("彼は照れ隠しのように視線を逸らしながら、繋いだ手に少しだけ力を込めた。");
                resultText.push("「俺に触れようとしてくれただけで、嬉しかった」");
                resultText.push("「……俺もだよ。ずっと前から……お前のことが好きだ」");
            } else if (playerAffection <= 7) {
                // Ending 2
                resultText.push("「……何日かかけて、ようやくわかったよ」");
                resultText.push("「お前、ずっと俺の手のひらに言葉を書いてたんだろ」");
                resultText.push("「不器用なりに、一生懸命伝えようとしてくれてたんだなって思ったら、なんか泣きそうになった」");
                resultText.push("彼は私の頭を優しく撫でると、そのままそっと引き寄せた。");
                resultText.push("「俺もずっと、同じ気持ちだった。……大好きだ。これからもずっと側にいてくれ」");
            } else if (playerAffection <= 11) {
                // Ending 3
                resultText.push("「毎日、色んなこと書いてただろ。全部ちゃんと伝わってたよ」");
                resultText.push("「お前の温もりが、手のひらからまっすぐ心に入ってくるみたいだった」");
                resultText.push("「文字の形とかじゃなくて、お前のその熱が愛おしくてたまらなかった」");
                resultText.push("彼は私の手を両手で包み込むと、その手の甲にそっと唇を落とした。");
                resultText.push("「……俺も、ずっと伝えたかった。愛してる。世界中の誰よりも」");
            } else if (playerAffection <= 15) {
                // Ending 4
                resultText.push("「……お前、わざと焦らしてただろ。毎日くすぐったいの我慢する身にもなれよ」");
                resultText.push("「でも……一つひとつの言葉に熱がこもってて、すごく嬉しかった」");
                resultText.push("「俺ばっかり我慢させられて、ちょっと悔しいから……これからは覚悟しとけよ？」");
                resultText.push("彼は意地悪く微笑むと、私の手を引いて強く抱きしめた。");
                resultText.push("「もう絶対に離さないからな。……好きだよ、バカ」");
            } else {
                // Ending 5
                resultText.push("「毎日毎日、あんなに一生懸命書いてくれて……もう、限界だった」");
                resultText.push("「言葉の全部が、お前の愛情そのものみたいで……俺の感情が爆発するかと思った」");
                resultText.push("「お前が愛おしすぎて、どうにかなりそう。……いや、もうおかしくなってるかも」");
                resultText.push("彼は熱を帯びた瞳で私を見つめると、息が止まるほどの強さで抱きすくめた。");
                resultText.push("「愛してるよ、世界で一番。……もう絶対に、お前を一人にはしない」");
            }

            resultText.push("（ダミーテキスト：ここまで）");
            resultText.push("〜 CLEAR！ プレイありがとうございました 〜");

            playText(resultText, () => {
                nextMark.style.display = 'none'; 
                msgBox.onclick = () => {
                    document.getElementById('game-screen').classList.remove('active');
                    document.getElementById('title-screen').classList.add('active');
                };
            });
        }
    </script>

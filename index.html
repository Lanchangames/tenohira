<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- スマホで見たときに最適なサイズにし、拡大縮小を無効化 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手のひらのナイショ話</title>
    <style>
        /* 全体のリセットと背景設定 */
        body {
            margin: 0;
            background-color: #222; /* スマホ以外の領域の背景色 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none; /* スワイプによる画面スクロールを防止 */
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }

        /* ゲーム画面のコンテナ（スマホ縦画面の比率） */
        #game-container {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 9 / 16;
            background-color: #ffe0bd; /* 手のひらをイメージした肌色 */
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        /* 各スクリーンの共通設定 */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .screen.active {
            display: flex;
        }

        /* タイトル画面の装飾 */
        h1 {
            color: #fff;
            text-shadow: 2px 2px 4px #ff8e8e;
            margin-bottom: 50px;
            font-size: 28px;
        }

        /* スタート画面の3つのボタン（すべて同じサイズ・デザイン） */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 70%;
        }
        .menu-btn {
            width: 100%;
            height: 55px;
            background-color: #ff9e9e;
            border: 3px solid #fff;
            border-radius: 30px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        .menu-btn:active {
            transform: scale(0.95);
        }

        /* メッセージウィンドウの設定 */
        #message-box {
            position: absolute;
            bottom: 3%;
            left: 5%;
            right: 5%;
            height: 28%;
            background-color: rgba(255, 255, 255, 0.9);
            border: 3px solid #ff9e9e;
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        #message-text {
            margin: 0;
            font-size: 15px;
            color: #333;
            line-height: 1.6;
            word-wrap: break-word;
        }

        /* 手のひら（キャンバス）部分の設定 */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 65%; /* メッセージウィンドウと被らないように */
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }
        #instruction {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #d36b6b;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 1px 1px 2px #fff;
        }

        /* 次へボタン・完了ボタン */
        .action-btn {
            align-self: flex-end;
            padding: 8px 20px;
            background: #ff9e9e;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- タイトル画面 -->
        <div id="title-screen" class="screen active">
            <h1>手のひらのナイショ話</h1>
            <div class="button-group">
                <button class="menu-btn" onclick="startGame()">はじめから</button>
                <button class="menu-btn" onclick="alert('セーブデータがありません')">つづきから</button>
                <button class="menu-btn" onclick="alert('設定項目はありません')">オプション</button>
            </div>
        </div>

        <!-- ゲーム（ノベル＆描画）画面 -->
        <div id="game-screen" class="screen">
            <div id="canvas-container">
                <canvas id="palm-canvas"></canvas>
                <div id="instruction" style="display:none;">指で画面をなぞって文字を書いてみよう</div>
            </div>
            <div id="message-box">
                <p id="message-text"></p>
                <button id="next-btn" class="action-btn" style="display:none;" onclick="nextMessage()">次へ ▼</button>
                <button id="finish-draw-btn" class="action-btn" style="display:none;" onclick="finishDrawing()">書き終わる</button>
            </div>
        </div>
    </div>

    <script>
        // 前半のシナリオ
        const introMessages = [
            "放課後の教室。幼馴染の彼と二人きり。",
            "「昔、よくやったよな。手のひらに文字書いて当てるやつ」",
            "そう言って、彼は私の前に、無防備に手のひらを差し出した。",
            "（……よし、何か書いてみよう）"
        ];
        
        // 後半のシナリオ
        const outroMessages = [
            "「……ん、くすぐったい」",
            "「えーっと、今の文字は……」",
            "「……本当に、それがお前の言いたいこと？」",
            "赤くなった顔を少し逸らして、彼は照れくさそうに笑った。"
        ];

        let msgIndex = 0;
        let isDrawing = false;
        let currentScenario = 'intro';
        
        const canvas = document.getElementById('palm-canvas');
        const ctx = canvas.getContext('2d');

        // キャンバスのサイズを画面に合わせる
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }

        // ゲーム開始
        function startGame() {
            document.getElementById('title-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            resizeCanvas();
            showMessage();
        }

        // メッセージの表示制御
        function showMessage() {
            const nextBtn = document.getElementById('next-btn');
            const finishBtn = document.getElementById('finish-draw-btn');
            const instruction = document.getElementById('instruction');
            const msgText = document.getElementById('message-text');

            if (currentScenario === 'intro') {
                if (msgIndex < introMessages.length) {
                    msgText.innerText = introMessages[msgIndex];
                    nextBtn.style.display = 'block';
                } else {
                    // お絵かきモードへ移行
                    msgText.innerText = "（相手の手のひらをなぞって、文字を書いてください）";
                    nextBtn.style.display = 'none';
                    finishBtn.style.display = 'block';
                    instruction.style.display = 'block';
                    setupDrawing();
                }
            } else if (currentScenario === 'outro') {
                if (msgIndex < outroMessages.length) {
                    msgText.innerText = outroMessages[msgIndex];
                    nextBtn.style.display = 'block';
                } else {
                    msgText.innerText = "〜 プレイありがとうございます 〜";
                    nextBtn.style.display = 'none';
                }
            }
        }

        function nextMessage() {
            msgIndex++;
            showMessage();
        }

        // スマホ・PC両対応のお絵かき機能
        function setupDrawing() {
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.strokeStyle = 'rgba(255, 120, 120, 0.4)'; // 肌になぞったような薄い赤

            // タップ・クリックされた座標を取得
            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const startDraw = (e) => { 
                e.preventDefault(); 
                isDrawing = true; 
                const pos = getPos(e); 
                ctx.beginPath(); 
                ctx.moveTo(pos.x, pos.y); 
            };
            
            const draw = (e) => { 
                if (!isDrawing) return; 
                e.preventDefault(); 
                const pos = getPos(e); 
                ctx.lineTo(pos.x, pos.y); 
                ctx.stroke(); 
            };
            
            const stopDraw = (e) => { 
                if (isDrawing) { 
                    e.preventDefault(); 
                    isDrawing = false; 
                } 
            };

            // PC用イベント
            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDraw);
            canvas.addEventListener('mouseleave', stopDraw);

            // スマホ用イベント
            canvas.addEventListener('touchstart', startDraw, {passive: false});
            canvas.addEventListener('touchmove', draw, {passive: false});
            canvas.addEventListener('touchend', stopDraw, {passive: false});
        }

        // 書き終わった後の処理
        function finishDrawing() {
            isDrawing = false;
            
            // イベントリスナーを削除してこれ以上書けないようにする（キャンバスのクローンを作成して置換）
            const newCanvas = canvas.cloneNode(true);
            canvas.parentNode.replaceChild(newCanvas, canvas);
            // 描画内容は消えちゃうので、元のctxの内容を新しいcanvasにコピー
            newCanvas.getContext('2d').drawImage(canvas, 0, 0);

            document.getElementById('instruction').style.display = 'none';
            document.getElementById('finish-draw-btn').style.display = 'none';
            
            // 後半のシナリオへ
            currentScenario = 'outro';
            msgIndex = 0;
            showMessage();
        }
    </script>
</body>
</html>

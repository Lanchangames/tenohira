<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手のひらのナイショ話</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1515;
            touch-action: none;
            font-family: 'Hiragino Mincho ProN', 'Noto Serif JP', serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            width: 100%;
            height: 100dvh;
            max-height: 100%;
            max-width: 400px;
            margin: 0 auto;
            background-color: #f4d5b6;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(26,21,21,0.8), rgba(26,21,21,0.8)), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%233e2723"/></svg>');
            background-size: cover;
        }
        .screen.active {
            display: flex;
        }

        /* ゲーム画面は背景なし（キャンバスが見えるように） */
        #game-screen {
            background: none;
        }

        h1 {
            color: #f4d5b6;
            text-shadow: 2px 2px 5px #000;
            margin-bottom: 20px;
            font-size: 26px;
            letter-spacing: 2px;
        }

        /* エンディングバッジ */
        #badge-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 80%;
            margin-bottom: 40px;
        }
        .badge {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #443;
            border: 2px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #111;
            font-size: 14px;
            font-weight: bold;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
            transition: all 0.3s;
        }
        .badge.unlocked {
            background-color: #f4d5b6;
            border-color: #8d4a4a;
            color: #8d4a4a;
            box-shadow: 0 0 8px #f4d5b6;
        }
        .badge.unlocked-x {
            background-color: #ff6b6b;
            border-color: #fff;
            color: #fff;
            box-shadow: 0 0 10px #ff6b6b;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 70%;
            z-index: 5;
        }
        .menu-btn {
            width: 100%;
            height: 55px;
            background-color: #8d4a4a;
            border: 2px solid #d3b89e;
            border-radius: 5px;
            color: #fff;
            font-size: 18px;
            font-family: 'Hiragino Mincho ProN', 'Noto Serif JP', serif;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: transform 0.1s;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .menu-btn:active {
            transform: scale(0.95);
        }

        /* 遊び方画面のテキスト */
        .instruction-text {
            color: #f4d5b6;
            width: 85%;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px #000;
        }
        .instruction-text p { margin: 10px 0; }

        #canvas-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        #gauge-container {
            position: absolute;
            top: 20px;
            left: 10%;
            width: 80%;
            height: 10px;
            background-color: rgba(0,0,0,0.2);
            border-radius: 5px;
            z-index: 2;
            display: none;
            overflow: hidden;
        }
        #gauge-bar {
            width: 0%;
            height: 100%;
            background-color: #ff6b6b;
            transition: width 0.1s;
        }

        /* 残り画数表示 */
        #stroke-counter {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            color: #8d4a4a;
            font-weight: bold;
            font-size: 16px;
            z-index: 2;
            display: none;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
        }

        #choice-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            z-index: 4;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .choice-hint {
            color: #f4d5b6;
            margin-bottom: 20px;
            font-size: 14px;
            text-shadow: 1px 1px 3px #000;
        }

        #message-box {
            position: absolute;
            bottom: 3%;
            left: 5%;
            right: 5%;
            height: 25%;
            background-color: rgba(26, 21, 21, 0.85);
            border: 2px solid #d3b89e;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #f4d5b6;
            cursor: pointer;
        }
        #message-text {
            margin: 0;
            font-size: 16px;
            line-height: 1.8;
            letter-spacing: 1px;
        }
        .blink-triangle {
            align-self: flex-end;
            animation: blink 1s infinite;
            font-size: 14px;
        }
        @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }

        #finish-btn {
            position: absolute;
            bottom: 35%;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 30px;
            background-color: #8d4a4a;
            border: 2px solid #d3b89e;
            color: white;
            border-radius: 5px;
            z-index: 4;
            display: none;
            font-family: inherit;
            font-size: 16px;
        }

        #day-transition {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1515;
            color: #f4d5b6;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            letter-spacing: 6px;
            opacity: 0;
            pointer-events: none; 
            transition: opacity 1s ease-in-out;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- タイトル画面 -->
        <div id="title-screen" class="screen active">
            <h1>手のひらのナイショ話</h1>
            <div id="badge-container">
                <!-- JSでバッジを生成 -->
            </div>
            <div class="button-group">
                <button class="menu-btn" onclick="startGame()">はじめから</button>
                <button class="menu-btn" onclick="showHowTo()">遊び方</button>
            </div>
        </div>

        <!-- 遊び方画面 -->
        <div id="how-to-screen" class="screen">
            <h1>遊び方</h1>
            <div class="instruction-text">
                <p>① 毎日、書きたい言葉（難易度）を選びます。</p>
                <p>② 指で画面をなぞって文字を書きます。</p>
                <p>③ 相手の限界ゲージがMAXになる前に「目標画数」なぞると成功！</p>
                <p>④ 難易度が高いほど好感度が上がります。</p>
                <p>★ エンディングは全部で９種類。特定の選択肢を選び続けると特別な結末が…？</p>
            </div>
            <div class="button-group">
                <button class="menu-btn" onclick="showTitle()">タイトルへ戻る</button>
            </div>
        </div>

        <!-- ゲーム画面 -->
        <div id="game-screen" class="screen">
            <canvas id="canvas-layer"></canvas>
            
            <div id="day-transition">１日目</div>

            <div id="gauge-container"><div id="gauge-bar"></div></div>
            <div id="stroke-counter">残り: 0 画</div>

            <div id="choice-overlay">
                <div class="choice-hint">※画数が多いほど難しく、好感度が上がります</div>
                <div class="button-group" id="choices-container"></div>
            </div>

            <button id="finish-btn" onclick="completeDrawPhase()">書き終える</button>

            <div id="message-box" onclick="advanceText()">
                <p id="message-text"></p>
                <div class="blink-triangle" id="next-mark">▼</div>
            </div>
        </div>
    </div>

    <script>
        // --- データ管理・セーブ機能 ---
        let unlockedEndings = [];
        try {
            unlockedEndings = JSON.parse(localStorage.getItem('secretHandshakeEndings')) || [];
        } catch (e) {
            unlockedEndings = [];
        }

        function saveEnding(id) {
            if (!unlockedEndings.includes(id)) {
                unlockedEndings.push(id);
                try {
                    localStorage.setItem('secretHandshakeEndings', JSON.stringify(unlockedEndings));
                } catch (e) {}
            }
        }

        function renderBadges() {
            const container = document.getElementById('badge-container');
            container.innerHTML = '';
            for (let i = 1; i <= 9; i++) {
                const badge = document.createElement('div');
                badge.className = 'badge';
                if (unlockedEndings.includes(i)) {
                    badge.innerText = i === 9 ? 'X' : i;
                    badge.classList.add(i === 9 ? 'unlocked-x' : 'unlocked');
                } else {
                    badge.innerText = '?';
                }
                container.appendChild(badge);
            }
        }

        // --- UI画面の切り替え ---
        function showTitle() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('title-screen').classList.add('active');
            renderBadges();
        }

        function showHowTo() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('how-to-screen').classList.add('active');
        }

        // 初期化実行
        renderBadges();

        // --- シナリオ・選択肢データ ---
        // ※ 難易度(diff): 0=易しい(特別ルートA用), 1=普通(特別ルートB用), 2=難しい(特別ルートC用)
        const dailyData = [
            {
                day: 1, label: "１日目",
                intro: ["夕食後の穏やかな時間。パチパチと暖炉の火が爆ぜる音が部屋に響いている。","（ダミーテキスト：ここからご自身の文章に）","「……ほら、手。貸して」","彼の手のひらに、なんて書いてみよう？"],
                choices: [
                    { text: "「あ」", req: 40, reward: 1, diff: 0 },
                    { text: "「ねえ」", req: 80, reward: 2, diff: 1 },
                    { text: "「おつかれ」", req: 140, reward: 3, diff: 2 }
                ],
                success: ["「……ん。なんか、悪くないな」","（少しだけ、想いが伝わった気がする）"],
                fail: ["「っ、ちょ！ くすぐったい！」","彼に手を引っ込められてしまった……。"]
            },
            {
                day: 2, label: "２日目",
                intro: ["翌日の夜。","「……あんま、くすぐったくすんなよ」","警戒しつつも彼が手を預けてくれた。","（今日はなんて書こう？）"],
                choices: [
                    { text: "「い」", req: 40, reward: 1, diff: 0 },
                    { text: "「いつも」", req: 90, reward: 2, diff: 1 },
                    { text: "「きもちいい？」", req: 150, reward: 3, diff: 2 }
                ],
                success: ["「……お前、手あったかいな」","彼の顔が少しだけ赤くなった。"],
                fail: ["「あーっ！ もう限界！」","やっぱりまだ難しかったみたいだ……。"]
            },
            {
                day: 3, label: "３日目",
                intro: ["３日目。","彼から無言で手が差し出される。","（今日は少し長めに書いてみようかな……？）"],
                choices: [
                    { text: "「し」", req: 40, reward: 1, diff: 0 },
                    { text: "「がんばれ」", req: 100, reward: 2, diff: 1 },
                    { text: "「ありがとう」", req: 160, reward: 3, diff: 2 }
                ],
                success: ["「……もっと、続けてもいいぞ」","少しずつ、彼も楽しんでくれている。"],
                fail: ["「……っ、ん、やっぱ無理！！」","変に力を入れてしまって失敗した……。"]
            },
            {
                day: 4, label: "４日目",
                intro: ["４日目。","「……最近、お前のマッサージがないと落ち着かないかも」","（今日こそ、もっと踏み込んだ言葉を……）"],
                choices: [
                    { text: "「て」", req: 50, reward: 1, diff: 0 },
                    { text: "「あしたも」", req: 110, reward: 2, diff: 1 },
                    { text: "「ずっといっしょ」", req: 180, reward: 3, diff: 2 }
                ],
                success: ["「……ん。なんか、すごく落ち着く」","確かな温もりが伝わってきた。"],
                fail: ["「あーもう、ごめん！ 限界！！」","あともう少しだったのに……！"]
            },
            {
                day: 5, label: "最終日",
                intro: ["５日目。","「……今日は、逃げない。だから……」","「お前が何書きたいのか、ちゃんと知りたい。教えてくれ」","（今なら、きっと伝わる。彼の手のひらに、なんて書こう……？）"],
                choices: [
                    { text: "「る」", req: 60, reward: 2, diff: 0 },
                    { text: "「だいすき」", req: 120, reward: 4, diff: 1 },
                    { text: "「あいしてる」", req: 200, reward: 6, diff: 2 }
                ]
            }
        ];

        // --- ヒントデータ ---
        const endingHints = {
            1: "【ヒント】難易度の高い文字を選んで、わざと何度も失敗してみよう。",
            2: "【ヒント】少しだけ好感度を稼いで、あとは失敗してみよう。",
            3: "【ヒント】成功と失敗を半分くらいにしてみよう。",
            4: "【ヒント】少し難しい文字を中心に成功させてみよう。",
            5: "【ヒント】一番難しい文字をたくさん成功させてみよう（すべて成功以外）。",
            6: "【ヒント】毎日、一番短い文字をつなげてみよう（あ・い・し・て・る）。",
            7: "【ヒント】毎日、真ん中の難易度の文字を書いてすべて成功してみよう。",
            8: "【ヒント】毎日、一番難しい文字を書いてすべて成功してみよう。",
            9: "【ヒント：Ending X】すべての記憶（他のエンディング）を取り戻した今、もう一度彼に触れてみよう。"
        };

        let currentDayIdx = 0;
        let phase = 'title'; 
        let textQueue = [];
        let isDrawing = false;
        let gauge = 0;
        let drawPoints = 0;
        let choiceHistory = []; // { diff: number, success: boolean }
        
        let playerAffection = 0;
        let currentTargetReq = 0;
        let currentReward = 0;
        let currentDiff = 0;
        let isGameLoopRunning = false;

        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        const gaugeContainer = document.getElementById('gauge-container');
        const gaugeBar = document.getElementById('gauge-bar');
        const strokeCounter = document.getElementById('stroke-counter');
        const msgBox = document.getElementById('message-box');
        const msgText = document.getElementById('message-text');
        const nextMark = document.getElementById('next-mark');
        const finishBtn = document.getElementById('finish-btn');
        const choiceOverlay = document.getElementById('choice-overlay');
        const choicesContainer = document.getElementById('choices-container');
        const dayTransition = document.getElementById('day-transition');

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.fillStyle = '#f4d5b6';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function startGame() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('game-screen').classList.add('active');
            
            playerAffection = 0;
            currentDayIdx = 0;
            choiceHistory = [];
            resizeCanvas();
            
            if (!isGameLoopRunning) {
                isGameLoopRunning = true;
                requestAnimationFrame(gameLoop);
            }
            startDay();
        }

        function startDay() {
            gauge = 0;
            drawPoints = 0;
            currentTargetReq = 0;
            currentReward = 0;
            strokeCounter.style.display = 'none';
            ctx.fillStyle = '#f4d5b6';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const dayData = dailyData[currentDayIdx];
            dayTransition.innerText = dayData.label;
            dayTransition.style.opacity = '1';
            phase = 'transition';

            setTimeout(() => {
                dayTransition.style.opacity = '0';
                setTimeout(() => {
                    playText(dayData.intro, showDailyChoices);
                }, 1000); 
            }, 1800); 
        }

        function playText(texts, callback) {
            phase = 'text';
            textQueue = [...texts];
            window.textCallback = callback;
            msgBox.style.display = 'flex';
            gaugeContainer.style.display = 'none';
            finishBtn.style.display = 'none';
            strokeCounter.style.display = 'none';
            nextMark.style.display = 'block';
            showNextText();
        }

        function showNextText() {
            if (textQueue.length > 0) {
                msgText.innerText = textQueue.shift();
            } else {
                if (window.textCallback) window.textCallback();
            }
        }

        function advanceText() {
            if (phase === 'text') showNextText();
        }

        function showDailyChoices() {
            phase = 'choice';
            msgBox.style.display = 'none';
            choiceOverlay.style.display = 'flex';
            choicesContainer.innerHTML = '';
            
            const dayData = dailyData[currentDayIdx];
            dayData.choices.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'menu-btn';
                btn.innerText = opt.text;
                btn.onclick = () => {
                    currentTargetReq = opt.req;
                    currentReward = opt.reward;
                    currentDiff = opt.diff;
                    choiceOverlay.style.display = 'none';
                    startDrawPhase();
                };
                choicesContainer.appendChild(btn);
            });
        }

        function startDrawPhase() {
            phase = 'draw';
            gaugeContainer.style.display = 'block';
            gaugeBar.style.width = '0%';
            strokeCounter.innerText = `目標まであと: ${currentTargetReq} 画`;
            strokeCounter.style.display = 'block';
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function handleStart(e) {
            if (phase !== 'draw') return;
            e.preventDefault();
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = (currentDayIdx === 4) ? 'rgba(180, 70, 70, 0.9)' : 'rgba(200, 100, 100, 0.5)';
        }

        function handleMove(e) {
            if (!isDrawing || phase !== 'draw') return;
            e.preventDefault();
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();

            drawPoints++;
            let remaining = Math.max(0, currentTargetReq - drawPoints);
            strokeCounter.innerText = `目標まであと: ${remaining} 画`;

            if (remaining === 0) {
                finishBtn.style.display = 'block';
            }
        }

        function handleEnd(e) {
            if (isDrawing) {
                e.preventDefault();
                isDrawing = false;
            }
        }

        canvas.addEventListener('mousedown', handleStart, {passive: false});
        canvas.addEventListener('mousemove', handleMove, {passive: false});
        canvas.addEventListener('mouseup', handleEnd, {passive: false});
        canvas.addEventListener('mouseleave', handleEnd, {passive: false});
        canvas.addEventListener('touchstart', handleStart, {passive: false});
        canvas.addEventListener('touchmove', handleMove, {passive: false});
        canvas.addEventListener('touchend', handleEnd, {passive: false});

        function gameLoop() {
            if (phase === 'draw') {
                ctx.fillStyle = 'rgba(244, 213, 182, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (isDrawing) {
                    const gaugeSpeed = (currentDayIdx === 4) ? 0.15 : 0.25;
                    gauge += gaugeSpeed;
                    gaugeBar.style.width = gauge + '%';

                    if (gauge >= 100) {
                        failDrawPhase();
                    }
                } else if (gauge > 0) {
                    gauge -= 0.2;
                    gaugeBar.style.width = gauge + '%';
                }
            }
            if (isGameLoopRunning) {
                requestAnimationFrame(gameLoop);
            }
        }

        function failDrawPhase() {
            isDrawing = false;
            gaugeContainer.style.display = 'none';
            finishBtn.style.display = 'none';
            strokeCounter.style.display = 'none';
            
            choiceHistory.push({ diff: currentDiff, success: false });

            if (currentDayIdx === 4) {
                playerAffection += 1; 
                evaluateEnding();
            } else {
                const dayData = dailyData[currentDayIdx];
                playText(dayData.fail, () => {
                    currentDayIdx++;
                    startDay();
                });
            }
        }

        function completeDrawPhase() {
            isDrawing = false;
            gaugeContainer.style.display = 'none';
            finishBtn.style.display = 'none';
            strokeCounter.style.display = 'none';
            
            choiceHistory.push({ diff: currentDiff, success: true });
            playerAffection += currentReward; 

            if (currentDayIdx === 4) {
                evaluateEnding();
            } else {
                const dayData = dailyData[currentDayIdx];
                playText(dayData.success, () => {
                    currentDayIdx++;
                    startDay();
                });
            }
        }

        // --- 9つのエンディング分岐とヒント処理 ---
        function evaluateEnding() {
            let resultText = [];
            let earnedEndingId = 1;

            const isAllSuccess = (targetDiff) => {
                return choiceHistory.length === 5 && choiceHistory.every(c => c.diff === targetDiff && c.success);
            };

            // 分岐ロジック
            if (unlockedEndings.length === 8 && !unlockedEndings.includes(9)) {
                earnedEndingId = 9; // Ending X (1〜8を全て見た後のプレイで強制移行)
            } else if (isAllSuccess(0)) {
                earnedEndingId = 6; // 特別ルートA (あ・い・し・て・る成功)
            } else if (isAllSuccess(1)) {
                earnedEndingId = 7; // 特別ルートB (中難易度すべて成功)
            } else if (isAllSuccess(2)) {
                earnedEndingId = 8; // 特別ルートC (高難易度すべて成功)
            } else {
                // 通常好感度ルート (1〜5)
                if (playerAffection <= 3) earnedEndingId = 1;
                else if (playerAffection <= 7) earnedEndingId = 2;
                else if (playerAffection <= 11) earnedEndingId = 3;
                else if (playerAffection <= 15) earnedEndingId = 4;
                else earnedEndingId = 5;
            }

            saveEnding(earnedEndingId);

            // 共通テキスト
            resultText.push("（ダミーテキスト：ここからエンディングの文章です）");
            resultText.push("書き終え、そっと指を離す。");

            // エンディングごとのテキスト（ダミー）
            if (earnedEndingId === 1) {
                resultText.push("【ED 1: ほのぼの不器用エンド】");
                resultText.push("「……お前、本当に不器用だよな」");
            } else if (earnedEndingId === 2) {
                resultText.push("【ED 2: 優しい両思いエンド】");
                resultText.push("「……何日かかけて、ようやくわかったよ」");
            } else if (earnedEndingId === 3) {
                resultText.push("【ED 3: ぴったりシンクロエンド】");
                resultText.push("「お前の温もりが、まっすぐ心に入ってくるみたいだった」");
            } else if (earnedEndingId === 4) {
                resultText.push("【ED 4: 情熱的な甘やかしエンド】");
                resultText.push("「……お前、わざと焦らしてただろ。我慢する身にもなれよ」");
            } else if (earnedEndingId === 5) {
                resultText.push("【ED 5: 溺愛の極みエンド】");
                resultText.push("「お前が愛おしすぎて、どうにかなりそう。……愛してるよ」");
            } else if (earnedEndingId === 6) {
                resultText.push("【ED 6: 特別ルート「あいしてる」】");
                resultText.push("「あ、い、し、て、る……だろ？ まったく、遠回りしやがって……」");
            } else if (earnedEndingId === 7) {
                resultText.push("【ED 7: 特別ルート「中難易度コンプ」】");
                resultText.push("「毎日、丁度いい言葉ばかり並べやがって。……俺も、同じ気持ちだよ」");
            } else if (earnedEndingId === 8) {
                resultText.push("【ED 8: 特別ルート「高難易度コンプ」】");
                resultText.push("「こんなに長い文字、よく毎日バレずに書けたな。……大好きだ」");
            } else if (earnedEndingId === 9) {
                resultText.push("【ED 9: Ending X】");
                resultText.push("「すべての記憶を辿って、また俺の手を握ってくれたんだな。……ありがとう」");
            }

            resultText.push("〜 CLEAR！ プレイありがとうございました 〜");

            // ヒントの抽出
            const lockedEndings = [1, 2, 3, 4, 5, 6, 7, 8, 9].filter(x => !unlockedEndings.includes(x));
            if (lockedEndings.length === 0) {
                resultText.push("★全エンディングコンプリート！おめでとうございます！");
            } else {
                let hintId;
                if (lockedEndings.length === 1 && lockedEndings[0] === 9) {
                    hintId = 9; // 残りが9だけなら9のヒントを表示
                } else {
                    const availableHints = lockedEndings.filter(x => x !== 9);
                    hintId = availableHints[Math.floor(Math.random() * availableHints.length)];
                }
                resultText.push(endingHints[hintId]);
            }

            resultText.push("〜 タイトルに戻ります 〜");

            playText(resultText, () => {
                nextMark.style.display = 'none'; 
                msgBox.onclick = () => {
                    showTitle();
                };
            });
        }
    </script>
</body>
</html>

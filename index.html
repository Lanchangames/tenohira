<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手のひらのナイショ話</title>
    <style>
        /* スマホの下部途切れを防止するための設定 */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1515;
            touch-action: none;
            font-family: 'Hiragino Mincho ProN', 'Noto Serif JP', serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            width: 100%;
            height: 100dvh; /* スマホの表示領域に正確に合わせる */
            max-height: 100%;
            max-width: 400px;
            margin: 0 auto;
            background-color: #f4d5b6;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .screen.active {
            display: flex;
        }

        /* タイトル画面 */
        #title-screen {
            background: linear-gradient(rgba(26,21,21,0.8), rgba(26,21,21,0.8)), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%233e2723"/></svg>');
            background-size: cover;
        }
        h1 {
            color: #f4d5b6;
            text-shadow: 2px 2px 5px #000;
            margin-bottom: 60px;
            font-size: 26px;
            letter-spacing: 2px;
        }

        /* スタート画面のボタン（すべて同じサイズ・デザイン） */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 70%;
        }
        .menu-btn {
            width: 100%;
            height: 55px;
            background-color: #8d4a4a;
            border: 2px solid #d3b89e;
            border-radius: 5px;
            color: #fff;
            font-size: 18px;
            font-family: 'Hiragino Mincho ProN', 'Noto Serif JP', serif;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: transform 0.1s;
            box-sizing: border-box;
        }
        .menu-btn:active {
            transform: scale(0.95);
        }

        /* ゲーム画面UI */
        #canvas-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        #gauge-container {
            position: absolute;
            top: 20px;
            left: 10%;
            width: 80%;
            height: 10px;
            background-color: rgba(0,0,0,0.2);
            border-radius: 5px;
            z-index: 2;
            display: none;
            overflow: hidden;
        }
        #gauge-bar {
            width: 0%;
            height: 100%;
            background-color: #ff6b6b;
            transition: width 0.1s;
        }
        #gauge-text {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            color: #8d4a4a;
            font-size: 14px;
            font-weight: bold;
            z-index: 2;
            display: none;
        }

        #message-box {
            position: absolute;
            bottom: 3%; /* 下が切れないように少し浮かす */
            left: 5%;
            right: 5%;
            height: 25%;
            background-color: rgba(26, 21, 21, 0.85);
            border: 2px solid #d3b89e;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #f4d5b6;
            cursor: pointer;
        }
        #message-text {
            margin: 0;
            font-size: 16px;
            line-height: 1.8;
            letter-spacing: 1px;
        }
        .blink-triangle {
            align-self: flex-end;
            animation: blink 1s infinite;
            font-size: 14px;
        }
        @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }

        #finish-btn {
            position: absolute;
            bottom: 35%;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 30px;
            background-color: #8d4a4a;
            border: 2px solid #d3b89e;
            color: white;
            border-radius: 5px;
            z-index: 4;
            display: none;
            font-family: inherit;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="title-screen" class="screen active">
            <h1>手のひらのナイショ話</h1>
            <div class="button-group">
                <button class="menu-btn" onclick="startGame()">はじめから</button>
                <button class="menu-btn" onclick="alert('セーブデータはありません')">つづきから</button>
                <button class="menu-btn" onclick="alert('設定項目はありません')">オプション</button>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <canvas id="canvas-layer"></canvas>
            
            <div id="gauge-container">
                <div id="gauge-bar"></div>
            </div>
            <div id="gauge-text">相手の限界ゲージ</div>

            <button id="finish-btn" onclick="finishFinalDraw()">書き終える</button>

            <div id="message-box" onclick="advanceText()">
                <p id="message-text"></p>
                <div class="blink-triangle" id="next-mark">▼</div>
            </div>
        </div>
    </div>

    <script>
        // --- 5日間のシナリオデータ ---
        const scenarios = {
            day1_intro: [
                "夕食の片付けも終わり、暖炉の火が心地よい音を立てている。",
                "「ほら、手」",
                "日課のマッサージ。幼馴染の彼は、無防備に手のひらを差し出した。",
                "（……この手に、文字を書いてみたら伝わるかな）"
            ],
            day1_fail: [
                "「……っ、ちょ、何すんだよ！」",
                "ビクッと肩を揺らし、彼は慌てて手を引っ込めた。",
                "「くすぐったいって！ 何書いてるか全然わからなかったぞ……」"
            ],
            day2_intro: [
                "翌日の夜。",
                "「……昨日みたいに、くすぐったくすんなよ？」",
                "警戒しつつも、彼はまた手を預けてくれた。",
                "（今日こそ……早く、でも丁寧に書こう）"
            ],
            day2_fail: [
                "「あーっ！ もう限界！」",
                "またしても手を引っ込められてしまった。",
                "「お前、絶対わざとやってるだろ……」"
            ],
            day3_intro: [
                "３日目。",
                "「……今日は我慢する。だから、普通に揉んでくれ」",
                "（少しだけなら、耐えてくれるかもしれない……）"
            ],
            day3_fail: [
                "「……っ、ん、やっぱ無理！！」",
                "「手のひらって敏感なんだよ。変なことすんなって……」",
                "少し赤くなった顔でそっぽを向かれてしまった。"
            ],
            day4_intro: [
                "４日目。",
                "「……」",
                "彼からは何も言わず、ただすっと手が差し出された。",
                "（今日こそ、最後まで書ききってみせる）"
            ],
            day4_fail: [
                "「あーもう、ごめん！ 限界！！」",
                "あと少しだったのに、彼は頭を抱えてしゃがみこんでしまった。",
                "「……お前が何したいのか、わかんねぇよ……」",
                "もどかしさだけが、暖炉の部屋に募っていく。"
            ],
            day5_intro: [
                "５日目。",
                "「……」",
                "彼は私の目を真っ直ぐに見つめ、ぎゅっと一度手を握り、そして開いた。",
                "「……今日は、絶対逃げない」",
                "「お前が何書きたいのか、ちゃんと知りたい。……教えてくれ」",
                "（……今なら、きっと全部伝わる）",
                "【ゆっくりと、「好き」の二文字を書いてください】"
            ],
            day5_outro: [
                "書き終え、そっと指を離す。",
                "彼はじっと自分の手のひらを見つめ……やがて、耳まで真っ赤に染め上げた。",
                "「……っ、ばか」",
                "「……そういう大事なことは、文字じゃなくて、ちゃんと声に出して言えよ」",
                "そう言いながらも、彼は握りしめたその手を、愛おしそうに自分の胸に押し当てた。",
                "〜 プレイありがとうございました 〜"
            ]
        };

        let currentDay = 1;
        let phase = 'title'; 
        let textQueue = [];
        let isDrawing = false;
        let gauge = 0;
        let isFinalDay = false;
        let drawPoints = 0; // 描画量をカウント
        
        const canvas = document.getElementById('canvas-layer');
        const ctx = canvas.getContext('2d');
        const gaugeContainer = document.getElementById('gauge-container');
        const gaugeBar = document.getElementById('gauge-bar');
        const gaugeText = document.getElementById('gauge-text');
        const msgBox = document.getElementById('message-box');
        const msgText = document.getElementById('message-text');
        const nextMark = document.getElementById('next-mark');
        const finishBtn = document.getElementById('finish-btn');

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.fillStyle = '#f4d5b6';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function startGame() {
            document.getElementById('title-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            resizeCanvas();
            startDay(1);
            requestAnimationFrame(gameLoop);
        }

        function startDay(day) {
            currentDay = day;
            gauge = 0;
            drawPoints = 0;
            isFinalDay = (day === 5); // 5日目を最終日に設定
            
            ctx.fillStyle = '#f4d5b6';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const introKey = `day${day}_intro`;
            playText(scenarios[introKey], () => startDrawPhase());
        }

        function playText(texts, callback) {
            phase = 'text';
            textQueue = [...texts];
            textCallback = callback;
            msgBox.style.display = 'flex';
            gaugeContainer.style.display = 'none';
            gaugeText.style.display = 'none';
            finishBtn.style.display = 'none';
            showNextText();
        }

        function showNextText() {
            if (textQueue.length > 0) {
                msgText.innerText = textQueue.shift();
            } else {
                if (textCallback) textCallback();
            }
        }

        function advanceText() {
            if (phase === 'text') showNextText();
        }

        function startDrawPhase() {
            phase = 'draw';
            msgBox.style.display = 'none'; 
            
            if (!isFinalDay) {
                gaugeContainer.style.display = 'block';
                gaugeText.style.display = 'block';
                gaugeBar.style.width = '0%';
            }
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function handleStart(e) {
            if (phase !== 'draw') return;
            e.preventDefault();
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = isFinalDay ? 'rgba(180, 70, 70, 0.8)' : 'rgba(200, 100, 100, 0.5)';
        }

        function handleMove(e) {
            if (!isDrawing || phase !== 'draw') return;
            e.preventDefault();
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();

            if (isFinalDay) {
                // 最終日は描画量をカウントし、一定量を超えたらボタン表示
                drawPoints++;
                if (drawPoints > 80) { // 「好き」と書くのに十分なストローク量
                    finishBtn.style.display = 'block';
                }
            } else {
                // 1〜4日目は日を追うごとにゲージの上がり方が少し緩やかになる
                const speeds = [1.8, 1.4, 1.0, 0.7]; 
                gauge += speeds[currentDay - 1]; 
                gaugeBar.style.width = gauge + '%';

                if (gauge >= 100) failDay();
            }
        }

        function handleEnd(e) {
            if (isDrawing) {
                e.preventDefault();
                isDrawing = false;
            }
        }

        canvas.addEventListener('mousedown', handleStart, {passive: false});
        canvas.addEventListener('mousemove', handleMove, {passive: false});
        canvas.addEventListener('mouseup', handleEnd, {passive: false});
        canvas.addEventListener('mouseleave', handleEnd, {passive: false});
        canvas.addEventListener('touchstart', handleStart, {passive: false});
        canvas.addEventListener('touchmove', handleMove, {passive: false});
        canvas.addEventListener('touchend', handleEnd, {passive: false});

        function gameLoop() {
            if (phase === 'draw' && !isFinalDay) {
                // 線が徐々に消える演出
                ctx.fillStyle = 'rgba(244, 213, 182, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (!isDrawing && gauge > 0) {
                    gauge -= 0.3;
                    gaugeBar.style.width = gauge + '%';
                }
            }
            requestAnimationFrame(gameLoop);
        }

        function failDay() {
            isDrawing = false;
            phase = 'text';
            gaugeContainer.style.display = 'none';
            gaugeText.style.display = 'none';
            
            const failKey = `day${currentDay}_fail`;
            playText(scenarios[failKey], () => startDay(currentDay + 1));
        }

        function finishFinalDraw() {
            isDrawing = false;
            finishBtn.style.display = 'none';
            playText(scenarios.day5_outro, () => {
                nextMark.style.display = 'none'; 
            });
        }
    </script>
</body>
</html>
